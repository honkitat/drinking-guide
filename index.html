<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>j-drinking</title>
<meta name="description" content="j-drinking — a personal archive of every wine, spirit, sake and beer I taste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5efe3;
  --paper-2:#e9dec6;
  --washi:#fcf9f2;
  --ink:#201915;
  --ink-soft:#4b4038;
  --muted:#5c4f3e;
  --line:#c9b691;
  --wine:#6d1f2c;
  --gold:#9c7b2e;
  --serif:'Cormorant Garamond','Noto Serif TC',serif;
  --body:'Noto Serif TC','Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{
  font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(120,95,58,.032) 0 1px,transparent 1px 104px),
    radial-gradient(1200px 820px at 50% -8%,rgba(255,252,244,.72),transparent 64%);
  background-attachment:fixed;line-height:1.8;-webkit-font-smoothing:antialiased;text-wrap:pretty;
}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--wine),rgba(109,31,44,.5));opacity:.92;z-index:60;pointer-events:none}
a{color:var(--wine);text-decoration:none}
a:hover{text-decoration:underline}

/* ── header ── */
header{position:sticky;top:0;z-index:40;background:rgba(245,239,227,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(120,95,58,.22)}
.hbar{max-width:1120px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
.logo{font-family:'Italiana',serif;font-size:1.16rem;letter-spacing:.02em;line-height:1;color:var(--ink);opacity:.93}
.logo i{font-style:normal;color:var(--wine)}
.logo .hy{font-family:Georgia,'Times New Roman',serif;font-size:1.12em;letter-spacing:.04em;vertical-align:-.04em}
.search{margin-left:auto;display:flex;align-items:center;gap:5px}
.search .mag{color:var(--muted);font-size:.95rem;line-height:1}
.search input{width:150px;padding:4px 2px;border:0;border-bottom:1px solid rgba(120,95,58,.5);border-radius:0;
  background:transparent;font-family:var(--body);font-size:.79rem;letter-spacing:.1em;color:var(--ink);outline:none;
  transition:border-color .25s,width .25s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-bottom-color:var(--wine);width:196px}
.langtoggle{display:flex;gap:10px}
.langtoggle button{border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--body);
  font-size:.74rem;letter-spacing:.14em;padding:2px 0;color:var(--muted);cursor:pointer;transition:.25s}
.langtoggle button.on{color:var(--ink);border-bottom-color:var(--wine)}
.langtoggle button:hover:not(.on){color:var(--wine)}

/* ── masthead ── */
.masthead{padding:60px 24px 22px;text-align:center}
.masthead .big{font-family:var(--serif);font-size:clamp(3.8rem,12vw,6.8rem);font-weight:500;line-height:1;
  letter-spacing:.2em;color:var(--ink);text-indent:.2em}
.masthead .sub{font-family:var(--serif);font-size:.92rem;letter-spacing:.36em;color:var(--ink-soft);margin-top:20px}
.masthead .rule{width:34px;height:1px;background:var(--wine);opacity:.6;margin:18px auto 0}

/* ── stats ── */
.stats{max-width:1120px;margin:18px auto 0;padding:0 24px;display:flex;justify-content:center;flex-wrap:wrap;
  border-top:1px solid rgba(120,95,58,.16);border-bottom:1px solid rgba(120,95,58,.16)}
.stat{flex:1 1 0;min-width:120px;text-align:center;padding:16px 8px;border-right:1px solid rgba(120,95,58,.13)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1;color:var(--ink)}
.stat .k{font-size:.67rem;letter-spacing:.18em;color:var(--muted);margin-top:7px}

/* ── coverage ── */
.cov{max-width:1120px;margin:0 auto;padding:34px 24px 6px}
.cov .h{display:flex;align-items:baseline;gap:12px}
.cov .h .k{font-family:var(--serif);font-size:.86rem;letter-spacing:.34em;color:var(--ink-soft)}
.cov .h .n{font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.cov .h .n b{color:var(--wine);font-weight:500}
.cov .h .bar{flex:1;height:2px;background:rgba(120,95,58,.14);margin:0 8px 6px;position:relative;overflow:hidden}
.cov .h .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--wine);width:0;transition:width .8s ease}
.covgroup{margin-top:12px}
.covgroup .gl{font-size:.6rem;letter-spacing:.26em;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.chip{font-size:.73rem;letter-spacing:.03em;color:var(--ink-soft);border:1px solid rgba(120,95,58,.3);
  padding:2px 8px;border-radius:1px;background:rgba(255,252,246,.55);cursor:pointer;transition:.25s}
.chip:hover{border-color:var(--wine);color:var(--wine)}
.chip.have{background:rgba(109,31,44,.9);border-color:var(--wine);color:#fbf3ee}
.chip.p{font-weight:500}
.chip sup{font-size:.5rem;opacity:.6;margin-left:2px}

/* ── filters ── */
.filters{max-width:1100px;margin:26px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;justify-content:center}
.pill{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);padding:3px 1px 4px;
  margin:0 10px;font-family:var(--body);font-size:.79rem;letter-spacing:.13em;cursor:pointer;transition:.25s}
.pill:hover{color:var(--wine);border-bottom-color:rgba(109,31,44,.32)}
.pill.active{color:var(--ink);border-bottom-color:var(--wine);font-weight:500}
.fbar{max-width:1100px;margin:12px auto 0;padding:10px 24px 0;display:flex;gap:6px;justify-content:center;
  align-items:center;flex-wrap:wrap;border-top:1px solid rgba(120,95,58,.14)}
.fbar .lab{font-size:.66rem;color:var(--muted);letter-spacing:.22em;margin-right:6px;white-space:nowrap}

/* ── grid ── */
.sechead{max-width:1120px;margin:0 auto;padding:30px 24px 0;display:flex;align-items:baseline;gap:12px}
.sechead .k{font-family:var(--serif);font-size:.84rem;letter-spacing:.36em;color:var(--ink-soft)}
.sechead .n{font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.sechead .sort{margin-left:auto;font-size:.68rem;color:var(--muted);letter-spacing:.12em;border:0;
  border-bottom:1px solid rgba(120,95,58,.45);background:transparent;padding:2px 0;cursor:pointer;transition:.25s}
.sechead .sort:hover{color:var(--wine);border-bottom-color:var(--wine)}
.grid{max-width:1120px;margin:0 auto;padding:22px 24px 46px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(22px,3.2vw,42px)}
.card{background:var(--washi);border:1px solid rgba(70,52,30,.13);border-radius:1px;overflow:hidden;cursor:pointer;
  display:block;color:inherit;text-decoration:none}
  position:relative;opacity:1;transform:none;transition:transform .5s cubic-bezier(.22,.61,.36,1),
  border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-3px);border-color:rgba(70,52,30,.3);
  box-shadow:0 12px 30px -22px rgba(50,35,15,.45)}
.card:hover .nm{color:var(--wine)}
.card .shot{width:100%;aspect-ratio:3/4;display:block;object-fit:cover;background:var(--paper-2);
  filter:saturate(.74) contrast(1.04) brightness(1.01);
  transition:filter .9s cubic-bezier(.22,.61,.36,1),transform 1.2s cubic-bezier(.22,.61,.36,1)}
.card:hover .shot{filter:saturate(1) contrast(1) brightness(1);transform:scale(1.015)}
.noimg{width:100%;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:linear-gradient(180deg,#f2ead9,#e7dcc5);position:relative;overflow:hidden}
.noimg::after{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,rgba(120,98,64,.05) 0 1px,transparent 1px 5px);opacity:.7}
.noimg .enso{position:absolute;width:62%;height:62%;color:rgba(140,114,74,.28)}
.noimg .btl{position:relative;width:44%;height:auto;color:rgba(96,76,46,.5)}
.noimg .btl{filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.noimg em{position:relative;font-style:normal;font-size:.56rem;letter-spacing:.2em;color:var(--muted);opacity:.75}
.seal{position:absolute;top:11px;right:11px;z-index:2;background:rgba(252,249,242,.94);border:1px solid var(--wine);
  color:var(--wine);font-family:var(--serif);font-size:.82rem;line-height:1;padding:5px 6px;border-radius:1px;
  transform:rotate(-1.5deg);letter-spacing:0}
.tag{position:absolute;top:11px;left:11px;z-index:2;background:rgba(252,249,242,.9);color:var(--wine);
  border:1px solid rgba(109,31,44,.45);font-size:.58rem;letter-spacing:.18em;padding:2px 6px;border-radius:1px}
.body{padding:15px 17px 19px;border-top:1px solid rgba(70,52,30,.09)}
.no{font-family:var(--serif);font-size:.66rem;letter-spacing:.26em;color:var(--wine);margin-bottom:3px}
a.card:hover{text-decoration:none}
.card .go{display:block;text-align:right;font-size:.64rem;letter-spacing:.14em;color:var(--wine);
  opacity:0;transform:translateX(-4px);transition:opacity .35s,transform .35s;margin-top:8px}
.card:hover .go{opacity:.85;transform:none}
a.jrow:hover{text-decoration:none}
.nm{font-family:var(--serif);font-size:1.24rem;font-weight:600;letter-spacing:.03em;line-height:1.35;
  transition:color .35s}
.nmen{font-size:.73rem;color:#5a4c3c;font-style:italic;letter-spacing:.03em;margin-top:2px;line-height:1.5}
.pr{font-size:.78rem;color:#3a2f26;letter-spacing:.04em;margin-top:5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rg{font-size:.74rem;color:#4b4038;letter-spacing:.04em;margin-top:3px}
.gr{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.gr span{font-size:.66rem;color:#3f342b;letter-spacing:.03em;border:1px solid rgba(120,95,58,.34);
  padding:1px 6px;border-radius:1px}
.empty{max-width:1120px;margin:0 auto;padding:40px 24px 70px;text-align:center;color:var(--muted);
  font-size:.82rem;letter-spacing:.14em}

/* ── journal ── */
.journal{max-width:1120px;margin:0 auto;padding:10px 24px 40px}
.jhead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid rgba(70,52,30,.14)}
.jhead .k{font-family:var(--serif);font-size:.82rem;letter-spacing:.36em;color:var(--ink-soft)}
.jhead .n{font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.jrow{display:grid;grid-template-columns:96px 1fr 1fr 56px;gap:12px;padding:10px 6px;margin:0 -6px;
  border-bottom:1px dashed rgba(70,52,30,.13);font-size:.79rem;color:var(--ink-soft);cursor:pointer;
  transition:.25s;text-decoration:none}
.jrow:hover{background:rgba(255,252,246,.7);padding-left:12px}
.jrow:hover .jn{color:var(--wine)}
.jrow .jd{color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.jrow .jn{font-family:var(--serif);font-size:.95rem;color:var(--ink);letter-spacing:.02em;transition:color .25s}
.jrow .jv{color:var(--muted);font-size:.73rem}
.jrow .js{text-align:right;font-family:var(--serif);color:var(--wine);font-size:.86rem}
.jempty{font-size:.75rem;color:var(--muted);letter-spacing:.12em;padding:14px 0}

footer{text-align:center;padding:34px 24px 56px;color:var(--muted);font-size:.67rem;letter-spacing:.14em;line-height:2.2}
footer .dot{opacity:.4;margin:0 6px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
@media(max-width:560px){
  .masthead{padding:46px 20px 20px}
  .grid{padding:20px 16px 60px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .nm{font-size:1.02rem}
  .stat .v{font-size:1.35rem}
  .hbar{padding:10px 14px;gap:10px}
  .search input{width:104px}.search input:focus{width:126px}
  .jrow{grid-template-columns:74px 1fr 48px;font-size:.74rem}
  .jrow .jv{display:none}
  .rows{grid-template-columns:1fr}
  .chip{font-size:.74rem;padding:4px 9px}
  .grid{gap:14px}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">j<span class="hy">-</span><i>drinking</i></div>

</div>

<div class="filters" id="tyfilters"></div>

<div class="grid" id="grid"></div>

</div>

<footer>

</footer>

const TASTINGS = [{"name":"Clase Azul Reposado","name_en":"Clase Azul Reposado — 100% blue Weber agave tequila, 8 months in American whiskey casks","lang":"es","type":"spirit","country":"Mexico","region":"Jalisco","appellation":"Tequila","grapes":[],"abv":40,"price":1780,"currency":"HKD","venue":"","occasion":"","photo":"images/tastings/undated-01.jpg","sat":{},"score":null,"note":"Pale gold; medium to full body. Cooked agave and agave nectar lead, with candied orange peel, toasted wood and a subtle hazelnut note from the American whiskey casks.","id":"undated-01","background":"Clase Azul started in Guadalajara in 1997, when Arturo Lomelí bottled tequila in hand-made ceramic rather than glass. Each decanter is shaped and painted by Mazahua artisans in Santa María Canchesdá and takes about two weeks to finish — which is why the empties end up on shelves instead of in the recycling.\n\nThe agave is 100% blue Weber from Los Altos de Jalisco, slow-cooked before fermentation; this reposado rests eight months in American whiskey casks — enough for vanilla and hazelnut, not enough to bury the cooked agave.","sources":"claseazul.com (production, tasting notes) · Barron's & Forbes (founding, 1997) · Vinfolio / Tasting Table / The Times (Santa María Canchesdá decanters, ~2 weeks each)","note_src":"Producer's tasting notes — claseazul.com","keywords":["cooked agave","agave nectar","candied orange peel","toasted wood","hazelnut"],"keywords_src":"producer's tasting notes","price_src":"Liquidz HK, HK$1,780 (750 ml) — also listed at HK$1,980 at hkonlinewineshop; checked 2026-10-28","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":1,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Les Folatières","name_en":"Puligny-Montrachet Premier Cru 'Les Folatières' — Chardonnay from the largest premier cru in Puligny, Côte de Beaune","lang":"fr","producer":"François Carillon","vintage":2023,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":1870,"currency":"HKD","venue":"","occasion":"","photo":"images/tastings/undated-02.jpg","sat":{},"score":null,"note":"","note_src":"","background":"The Carillon name has farmed Puligny for roughly four centuries — “1611” is the date they print on the label. The domaine itself dates from 2010, when Louis Carillon retired and the estate split amicably between his sons François and Jacques; both labels still carry the same weight in the village.\n\nLes Folatières is Puligny's largest premier cru: a steep east-to-south-east slope at about 276 m, thin soil over limestone scree. It ripens early, so the wines come out broader than the village's tightest premiers crus — stone fruit and honeysuckle rather than the razor edge of a Pucelles.\n\n2023 was Burgundy's warmest year on record. The whites came in generous in fruit and volume, the risk being low acid and high alcohol where picking ran late; the best kept a racy line under all that richness.","sources":"francoiscarillon.com (domaine 2010; family in Puligny, “1611” on the label) · The Drinks Business / Decanter (2010 split with Jacques Carillon) · Terroirium & Olivier Leflaive (Les Folatières: largest 1er cru, ~276 m, east/south-east, limestone scree) · Berry Bros. & Rudd, Decanter, JancisRobinson.com (vintage 2023)","id":"undated-02","keywords":["honeysuckle","white peach","crushed chalk","toasted hazelnut","racy acidity"],"keywords_src":"critic descriptors for Carillon Les Folatières (Jasper Morris MW and others)","price_src":"Grape n Grain HK, HK$1,870 (750 ml) — Enoteca HK lists HK$2,200; checked 2026-10-28","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":2,"date_disp":"28 Oct 2026*"},{"name":"Krug Grande Cuvée 173ème Édition","name_en":"Krug Grande Cuvée 173ème Édition — multi-vintage Brut Champagne, blended around the 2017 harvest","lang":"fr","producer":"Krug","vintage":null,"type":"sparkling","country":"France","region":"Champagne · Reims","appellation":"Champagne AOC","grapes":["Chardonnay","Pinot Noir","Meunier"],"abv":12.5,"price":1980,"currency":"HKD","price_src":"Feast Market HK, HK$1,980 (750 ml), checked 2026-10-28 — hkonlinewineshop listed HK$1,458 on the same check","venue":"","occasion":"","photo":"images/tastings/undated-03.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["toast","brioche","stone fruit","vanilla cream","crisp lemon finish"],"keywords_src":"Krug official tasting notes for the 173ème Édition","background":"Grande Cuvée is rebuilt every year rather than being a fixed recipe. The 173ème Édition is composed around the 2017 harvest: 150 wines from 13 different vintages, the youngest 2017, blended so that the house style — not the year — is what you taste. That vertical blending is the entire Krug argument, and it is why the label carries an edition number instead of a vintage.\n\nThe wine is fermented and raised in oak and then spends years on its lees before release, which is where the toast and pastry weight comes from. It drinks like white Burgundy with bubbles: unctuous and creamy, then a crisp lemon finish that resets the palate.","sources":"krug.com (173ème Édition: 150 wines, 13 vintages, base 2017; tasting notes) · Feast Market HK listing (price)","id":"undated-03","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":3,"date_disp":"28 Oct 2026*"},{"name":"Riserva Lunelli 2016","name_en":"Ferrari Riserva Lunelli 2016 — Trentodoc Extra Brut, 100% Chardonnay, 69 months on the lees","lang":"it","producer":"Ferrari Trento","vintage":2016,"type":"sparkling","country":"Italy","region":"Trentino · Trento","appellation":"Trentodoc DOC","grapes":["Chardonnay"],"abv":12.5,"price":690,"currency":"HKD","price_src":"RNG Wine HK lists the 2015 at HK$690 (750 ml); the 2016 is not currently listed in HK — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/undated-04.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["crème brûlée","ripe apricot","smoke","vanilla","jasmine"],"keywords_src":"Ferrari official tasting note for Riserva Lunelli 2016","background":"Ferrari was founded in Trento in 1902 and is Italy's reference traditional-method sparkling house; the label still says “dal 1902”. Riserva Lunelli is the family's own cuvée — 100% Chardonnay from mountain vineyards, picked by hand, and the only Ferrari whose first fermentation happens in large Austrian oak casks, the way it was done in Bruno Lunelli's time.\n\nIt rests a minimum of 69 months on the lees, so a 2016 is only now arriving in condition. Expect gold, smoke and crème brûlée over ripe apricot, with mountain acidity holding the richness in place — Italy's answer to Champagne, from a colder, higher place.","sources":"ferraritrento.com technical sheet for Riserva Lunelli 2016 (69 months, oak fermentation, 12.5%, tasting note) · RNG Wine HK (price)","id":"undated-04","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":4,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Champ Gain","name_en":"Olivier Leflaive, Puligny-Montrachet Premier Cru 'Champ Gain' — Chardonnay from Puligny's upper slope","lang":"fr","producer":"Olivier Leflaive","vintage":null,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":1380,"currency":"HKD","price_src":"RNG Wine HK, Olivier Leflaive Puligny 1er Cru Champ Gain 2022, HK$1,380 (750 ml), checked 2026-10-28 — vintage on your bottle is not visible","venue":"","occasion":"","photo":"images/tastings/undated-05.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["white peach","hazelnut","wet stone","honeysuckle","firm acidity"],"keywords_src":"Climat and producer profiles for Champ Gain (Olivier Leflaive technical sheet; Puligny reference notes)","background":"Champ Gain takes its name from fields won back from the forest and then planted to vine — a 10.7-hectare premier cru on Puligny's upper slope, sitting at 250–300 m. Higher and cooler than the famous middle vineyards of the village, it gives a Puligny with more tension than plushness.\n\nOlivier Leflaive runs a négociant house in Puligny — the Leflaive name is the same family as Domaine Leflaive, a different business. He buys grapes and must from growers he has contracted for years and makes the wine in his own cellar, which is how a premier cru from this address reaches a shelf without grand cru pricing.","sources":"olivier-leflaive.com (Champ Gain: name origin, climat) · vincod technical sheet (10.7 ha, 250–300 m) · RNG Wine HK (price)","id":"undated-05","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":5,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Les Chalumaux","name_en":"Domaine de la Choupette, Puligny-Montrachet Premier Cru 'Les Chalumaux' 2023 — Chardonnay","lang":"fr","producer":"Domaine de la Choupette","vintage":2023,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":880,"currency":"HKD","price_src":"YOHO Hong Kong lists the 2022 at HK$880 (750 ml, currently out of stock); the 2023 has no HK listing yet — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/undated-06.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe white fruit","vanilla","roasted hazelnut","floral","saline finish"],"keywords_src":"Importer tasting note for Domaine de la Choupette Les Chalumaux (2022, same cuvée)","background":"Domaine de la Choupette is in Santenay, at the southern end of the Côte de Beaune, run by twin brothers Jean-Christophe and Philippe Gutrin. They farm traditionally and hold HVE 3 (high environmental value) certification since 2022 — a small family domaine bottling a Puligny premier cru from bought fruit.\n\nLes Chalumaux sits at the Meursault end of Puligny, lower on the slope than the great middle vineyards, so the wine tends broader and nuttier than a limestone-driven site like Folatières up the hill. In practice: ripe white fruit, a vanilla-and-hazelnut edge from oak, and a saline finish — Puligny in a softer register.","sources":"Domaine de la Choupette / importer notes (Santenay, Gutrin twins, HVE 3 since 2022, tasting note) · YOHO Hong Kong (price) · Wine-Searcher (Les Chalumaux climat)","id":"undated-06","date":"2026-10-28","date_guess":true,"added":"2026-10-28","no":6,"date_disp":"28 Oct 2026*"},{"name":"Grand Vin de Léoville du Marquis de Las Cases","name_en":"Château Léoville Las Cases, Saint-Julien 2ème Cru Classé 1998 — Cabernet-dominant Bordeaux from the Delon family","lang":"fr","producer":"Château Léoville Las Cases","vintage":1998,"type":"red","country":"France","region":"Bordeaux · Saint-Julien","appellation":"Saint-Julien AOC","grapes":["Cabernet Sauvignon","Merlot"],"abv":13.0,"price":2385,"currency":"HKD","price_src":"Millesima Hong Kong, HK$7,154 for a 3-bottle case = HK$2,384.67 per bottle, checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-01.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["black cherry","lead pencil","graphite","smoke","firm tannin"],"keywords_src":"Christie's tasting note for the 1998","background":"Léoville Las Cases is one of the oldest estates in the Médoc — the Domaine de Léoville was split three ways after the Revolution, and this is the piece that kept the château and the best terroir, right up against Latour's enclosure. It was classed 2ème Cru in 1855 and has spent the last century behaving like something better; the Delon family have run it since the early 1900s, today under Jean-Hubert Delon.\n\n1998 was a Cabernet year on the Left Bank, and this is one of the wines that proves it: cassis and black cherry under a wall of tannin, with the lead-pencil and graphite signature that Las Cases always gives. It is 27 years old and still climbing — the sort of bottle you decant for an hour and then wish you had opened five years ago.","sources":"Christie's lot note (tasting note) · domaines-delon.com / Wikipedia (estate history, 1855 classification) · Bordeaux Index (13.0% ABV) · Millesima HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-01","no":7,"date_disp":"28 Oct 2026*"},{"name":"Vosne-Romanée 1er Cru Les Chaumes","name_en":"Domaine Méo-Camuzet, Vosne-Romanée Premier Cru 'Les Chaumes' 2023 — Pinot Noir from the lower slope","lang":"fr","producer":"Domaine Méo-Camuzet","vintage":2023,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Vosne-Romanée","appellation":"Vosne-Romanée Premier Cru","grapes":["Pinot Noir"],"abv":null,"price":1650,"currency":"HKD","price_src":"No 2023 listing in Hong Kong yet; Burgundy Cave HK offered the 2021 Les Chaumes at HK$1,650–1,700 per bottle (Oct 2024) — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-02.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe red fruit","black fruit","new oak","sweet spice","fresh acidity"],"keywords_src":"Domaine Méo-Camuzet tasting note for the 2023 Vosne-Romanée","background":"Méo-Camuzet's vines came to the family through Étienne Camuzet, the Vosne politician who bought the Château du Clos de Vougeot in 1920. For decades the vineyards were farmed by Henri Jayer as métayer — the arrangement that produced some of the most famous Burgundies never sold under his own name — and Jean-Nicolas Méo took the domaine over in 1989 with Jayer still looking over his shoulder.\n\nLes Chaumes sits low on the slope at the Nuits end of Vosne, which is why it is usually the most open and least austere of the village's premiers crus. In 2023 the fruit is ripe and lifted, the new oak still showing its spice — a Vosne built for ten years rather than thirty.","sources":"meo-camuzet.com (estate history, Les Chaumes, 2023 tasting note) · Burgundy Cave HK (price reference)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-02","no":8,"date_disp":"28 Oct 2026*"},{"name":"Clos des Goisses","name_en":"Philipponnat Clos des Goisses 2003 — single-vineyard Brut Champagne from the steepest slope in the region","lang":"fr","producer":"Philipponnat","vintage":2003,"type":"sparkling","country":"France","region":"Champagne · Mareuil-sur-Aÿ","appellation":"Champagne AOC","grapes":["Pinot Noir","Chardonnay"],"abv":12.0,"price":1980,"currency":"HKD","price_src":"Burgundy Cave HK, HK$1,980 per bottle (Jan 2024 offer), checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-03.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe peach","honey","toasted hazelnut","creamy mousse","soft acidity"],"keywords_src":"Climat and vintage profile for Clos des Goisses 2003 (Essi Avellan scored it 91–93)","background":"Clos des Goisses is a 5.83-hectare walled vineyard in Mareuil-sur-Aÿ, planted on a 45° slope that drops toward the Marne — the steepest vineyard in Champagne, and one of the oldest clos in the region. Philipponnat has owned it for nearly a century, and it is the only Champagne house whose flagship is a single walled plot rather than a blend of villages.\n\n2003 was the heatwave year: sugar without much acid, and a Champagne that came out broad, honeyed and Pinot-driven rather than sharp. Roughly two-thirds Pinot Noir to one-third Chardonnay here, which is why it reads more like a white Burgundy with bubbles than an aperitif.","sources":"philipponnat.com (5.83 ha walled clos, 45° slope, Mareuil-sur-Aÿ) · Essi Avellan (2003: 65% Pinot Noir / 35% Chardonnay, 91–93 pts) · Burgundy Cave HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-03","no":9,"date_disp":"28 Oct 2026*"},{"name":"Chambertin-Clos de Bèze Grand Cru","name_en":"Domaine Faiveley, Chambertin-Clos de Bèze Grand Cru 2015 — bottle No. 0636 of 3,022","lang":"fr","producer":"Domaine Faiveley","vintage":2015,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Gevrey-Chambertin","appellation":"Chambertin-Clos de Bèze Grand Cru","grapes":["Pinot Noir"],"abv":null,"price":4129,"currency":"HKD","price_src":"Crop & Vine HK, HK$24,772 for a 6-bottle case = HK$4,128.67 per bottle, checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-04.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["dark cherry","rose petal","liquorice","savoury earth","firm tannin"],"keywords_src":"Climat and vintage profile for Clos de Bèze 2015 (critics scored it 93–98)","background":"Faiveley has been a négociant house in Nuits-Saint-Georges since 1825, and it is now in its seventh generation with Erwan Faiveley running it. Clos de Bèze is the other great grand cru of Gevrey-Chambertin, 15.4 hectares lying above Chambertin itself, and the two have been argued over for two centuries as to which is finer.\n\nThe label is unusually honest: 3,022 bottles from this harvest, this one No. 0636, bottled at the domaine. 2015 was a warm, concentrated vintage in the Côte de Nuits, and Clos de Bèze carried it well — rose and dark cherry over a firm, savoury spine.","sources":"Label (3,022 bottles, No. 0636, mis en bouteille au domaine) · Decanter (Clos de Bèze 15.4 ha) · Atlas Fine Wines / Burghound (Erwan Faiveley, 7th generation; 93–96) · Crop & Vine HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-04","no":10,"date_disp":"28 Oct 2026*"},{"name":"Griotte-Chambertin Grand Cru","name_en":"Domaine Ponsot, Griotte-Chambertin Grand Cru 2014 — the smallest of the Gevrey grands crus","lang":"fr","producer":"Domaine Ponsot","vintage":2014,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Gevrey-Chambertin","appellation":"Griotte-Chambertin Grand Cru","grapes":["Pinot Noir"],"abv":13.5,"price":4688,"currency":"HKD","price_src":"TwoMoreGlasses HK, HK$4,688 per bottle (75 cl), checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-05.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["morello cherry","rose","forest floor","fine tannin","fresh acidity"],"keywords_src":"Climat and vintage profile for Griotte-Chambertin 2014 (Robert Parker 94)","background":"Domaine Ponsot was founded in Morey-Saint-Denis in 1872 by William Ponsot, and the family has held vines in the great sites of the village ever since. Griotte-Chambertin is the smallest of Gevrey's grands crus at 2.69 hectares, and Ponsot is one of the few owners with a serious holding — the name comes from the griotte, the sour morello cherry the wine is supposed to resemble rather than any cherry in the ground.\n\nThis 2014 was made while Laurent Ponsot still ran the domaine, before he left in 2017 to bottle under his own name. Cool vintage, small crop: red-fruited and lifted rather than powerful, which is exactly the register Griotte is prized for.","sources":"Domaine Ponsot / Goedhuis (founded 1872 by William Ponsot) · Decanter (Griotte-Chambertin 2.69 ha) · Wine Investment / RP (94 pts, 13.5%) · TwoMoreGlasses HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-05","no":11,"date_disp":"28 Oct 2026*"}];

  zh:{covk:'WSET L2 品種', sec:'酒藏', journal:'日誌', sort:'最新優先', sortScore:'按分數',
      all:'全部', empty:'還沒有記錄。下一支酒，就是第一格。',
      count:(n)=>`${n} 支`, tasted:'已嚐', of:'/', jblankdate:'未有日期——你講低幾時飲，就會排到這裡。',
      k_bottles:'支', k_grapes:'品種', k_countries:'國家', k_avg:'平均分'},
  en:{covk:'WSET L2 VARIETIES', sec:'CELLAR', journal:'JOURNAL', sort:'Newest first', sortScore:'By score',
      all:'All', empty:'No records yet. The next bottle is the first card.',
      count:(n)=>`${n} ${n===1?'bottle':'bottles'}`, tasted:'tasted', of:'/', jblankdate:'No dates yet — tell me when you drank it and it lands here.',
      k_bottles:'Bottles', k_grapes:'Varieties', k_countries:'Countries', k_avg:'Avg score'}
};
const TYPE = {
  red:['紅酒','Red'], white:['白酒','White'], rose:['粉紅','Rosé'], sparkling:['氣泡','Sparkling'],
  fortified:['加烈','Fortified'], spirit:['烈酒','Spirit'], sake:['清酒','Sake'], beer:['啤酒','Beer']
};
let LANG='en', TYPE_FILTER='all', COUNTRY_FILTER='all', GRAPE_FILTER='', QUERY='', BY_SCORE=false;

const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(k)=>T[LANG][k];
const nameOf=(g)=>{const c=CATALOG.find(x=>x.key===g||x.en===g||x.cn===g);return c?(LANG==='zh'?c.cn:c.en):g;};
const typeOf=(ty)=>TYPE[ty]?TYPE[ty][LANG==='zh'?0:1]:ty;

function realTastings(){return TASTINGS.filter(x=>x.date||x.producer||x.name);}

function renderStats(){
  const list=realTastings();
  const grapes=new Set(); const countries=new Set(); const scores=[];
  list.forEach(x=>{ (x.grapes||[]).forEach(g=>grapes.add(g)); if(x.country)countries.add(x.country); if(x.score)scores.push(x.score); });
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):'—';
  const cells=[[list.length,t('k_bottles')],[grapes.size,t('k_grapes')],[countries.size,t('k_countries')],[avg,t('k_avg')]];
  $('#stats').innerHTML=cells.map(([v,k])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}

function renderCoverage(){
  const list=realTastings();
  const have=new Set();
  list.forEach(x=>(x.grapes||[]).forEach(g=>have.add(g)));
  const isHave=(c)=>have.has(c.key)||have.has(c.en)||have.has(c.cn)||
      (c.key==='semillon'&&have.has('Sémillon'))||(c.key==='albarino'&&have.has('Albariño'));
  const n=CATALOG.filter(isHave).length;
  $('#covk').textContent=t('covk');
  $('#covn').innerHTML=`${t('tasted')} <b>${n}</b> / ${CATALOG.length}`;
  const bar=document.querySelector('.cov .h .bar i');
  if(bar) bar.style.width=(100*n/CATALOG.length).toFixed(1)+'%';
  const chip=(c)=>{const hv=isHave(c); const label=LANG==='zh'?c.cn:c.en;
    return `<span class="chip${hv?' have':''}${c.principal?' p':''}" data-g="${esc(c.en)}" title="${esc(c.en)}">${esc(label)}</span>`;};
  const P=CATALOG.filter(c=>c.principal), R=CATALOG.filter(c=>!c.principal);
  $('#chips').innerHTML =
    `<div class="covgroup"><div class="gl">${LANG==='zh'?'核心品種 · 8':'PRINCIPAL · 8'}</div><div class="chips" style="margin-top:0">${P.map(chip).join('')}</div></div>`+
    `<div class="covgroup"><div class="gl">${LANG==='zh'?'地區品種 · 22':'REGIONAL · 22'}</div><div class="chips" style="margin-top:0">${R.map(chip).join('')}</div></div>`;
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    const g=el.dataset.g; GRAPE_FILTER = (GRAPE_FILTER===g)?'':g; renderFilters(); renderGrid();
  });
}

function renderFilters(){
  const list=realTastings();
  const ORDER=['red','white','rose','sparkling','fortified','spirit','sake','beer'];
  const types=[...new Set(list.map(x=>x.type).filter(Boolean))].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const countries=[...new Set(list.map(x=>x.country).filter(Boolean))];
  $('#tyfilters').innerHTML=`<button class="pill${TYPE_FILTER==='all'?' active':''}" data-ty="all">${t('all')}</button>`+
    types.map(ty=>`<button class="pill${TYPE_FILTER===ty?' active':''}" data-ty="${esc(ty)}">${esc(typeOf(ty))}</button>`).join('');
  document.querySelectorAll('#tyfilters .pill').forEach(b=>b.onclick=()=>{TYPE_FILTER=b.dataset.ty;renderFilters();renderGrid();});
  $('#cfilters').innerHTML=`<span class="lab">${LANG==='zh'?'產地':'ORIGIN'}</span>`+
    [`<button class="pill${COUNTRY_FILTER==='all'?' active':''}" data-c="all">${t('all')}</button>`]
      .concat(countries.map(c=>`<button class="pill${COUNTRY_FILTER===c?' active':''}" data-c="${esc(c)}">${esc(c)}</button>`)).join('');
  document.querySelectorAll('#cfilters .pill').forEach(b=>b.onclick=()=>{COUNTRY_FILTER=b.dataset.c;renderFilters();renderGrid();});
  $('#sortbtn').textContent=BY_SCORE?t('sortScore'):t('sort');
}

function matches(x){
  if(TYPE_FILTER!=='all'&&x.type!==TYPE_FILTER)return false;
  if(COUNTRY_FILTER!=='all'&&x.country!==COUNTRY_FILTER)return false;
  if(GRAPE_FILTER){const gs=(x.grapes||[]).map(g=>nameOf(g));if(!gs.includes(nameOf(GRAPE_FILTER)))return false;}
  if(QUERY){const hay=[x.name,x.producer,x.region,x.appellation,x.note].concat(x.grapes||[]).join(' ').toLowerCase();
    if(!hay.includes(QUERY.toLowerCase()))return false;}
  return true;
}

function card(x){
  const gs=(x.grapes||[]).map(g=>`<span>${esc(nameOf(g))}</span>`).join('');
  const img=x.photo?`<img class="shot" src="${esc(x.photo)}" alt="${esc(x.name)}" loading="lazy">`
    :`<div class="noimg">
        <svg class="enso" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M50 10a40 40 0 1 1-12 78" stroke-linecap="round"/></svg>
        <svg class="btl" viewBox="0 0 40 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M16 8h8v26c0 5 9 9 9 17v55a6 6 0 0 1-6 6H13a6 6 0 0 1-6-6V51c0-8 9-12 9-17V8z"/>
          <path d="M7 62h26" stroke-width="1"/>
          <path d="M7 74h26" stroke-width=".8" opacity=".55"/>
        </svg>
      </div>`;
  const no=String(x.no||0).padStart(3,"0");
  return `<a class="card" href="bottle-${no}/">
    ${x.sample?`<span class="tag">${LANG==='zh'?'樣本':'SAMPLE'}</span>`:''}
    ${x.score?`<span class="seal">${x.score}</span>`:''}
    ${img}
    <div class="body">
      <div class="no">No. ${no}</div>
      <div class="nm">${esc(x.name)}</div>
      ${x.name_en?`<div class="nmen">${esc(x.name_en)}</div>`:''}
      ${(x.producer||x.vintage)?`<div class="pr">${esc([x.producer,x.vintage].filter(Boolean).join(' · '))}</div>`:''}
      <div class="rg">${esc([x.country,x.region].filter(Boolean).join(' · '))}</div>
      <div class="gr">${gs}</div>
      <span class="go">view →</span>
    </div>
  </a>`;
}

function renderGrid(){
  const list=realTastings().filter(matches);
  const sorted=list.slice().sort((a,b)=>{
    if(BY_SCORE)return (b.score||0)-(a.score||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  $('#seck').textContent=t('sec');
  $('#secn').textContent=t('count')(sorted.length);
  if(!sorted.length){
    $('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1">${t('empty')}</div>`;
  }else{
    $('#grid').innerHTML=sorted.map(card).join('');
    /* cards are plain links to their own bottle page — no modal */
  }
  renderJournal();
}

function renderJournal(){
  const list=realTastings().filter(x=>x.date).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('#jk').textContent=t('journal');
  $('#jn').textContent=list.length?`${list.length}`:'';
  $("#jlist").innerHTML = list.length? list.map(x=>`<a class="jrow" href="bottle-${String(x.no||0).padStart(3,"0")}/">
      <span class="jd">${esc(x.date_disp||x.date)}</span>
      <span class="jn">${esc(x.name)}</span>
      <span class="jv">${esc(x.venue||'—')}</span>
      <span class="js">${x.score||'—'}</span></a>`).join('')
      + `<div class="jn te" style="border:0;padding-top:8px;color:var(--muted);font-size:.64rem;letter-spacing:.06em">
           * dated when the bottle was logged; tell me the real day and I will correct it.</div>`
    : `<div class="jempty">${realTastings().length?t('jblankdate'):t('empty')}</div>`;
}

$('#q').oninput=(e)=>{QUERY=e.target.value.trim();renderGrid();};
$('#sortbtn').onclick=()=>{BY_SCORE=!BY_SCORE;renderFilters();renderGrid();};
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l;
  document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));
  $('#ft2').textContent=LANG==='zh'?'飲過的，記下來':'what I drank, written down';
  $('#q').placeholder=LANG==='zh'?'搜尋酒名、產區、品種…':'search wine, region, grape…';
  renderStats();renderCoverage();renderFilters();renderGrid();
});

renderStats();renderCoverage();renderFilters();renderGrid();

/* site visit counter — external service; renders nothing if it fails */
fetch('https://abacus.jasoncameron.dev/hit/'+"just-drink"+'/site')
  .then(r=>r.json())
  .then(d=>{ if(d && typeof d.value==='number'){ const el=$('#siteviews');
      el.textContent=d.value+(d.value===1?' visit':' visits'); el.hidden=false; } })
  .catch(()=>{});
</script>
</body>
</html>
