<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>j-drinking</title>
<meta name="description" content="j-drinking — a personal archive of every wine, spirit, sake and beer I taste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5efe3;
  --paper-2:#e9dec6;
  --washi:#fcf9f2;
  --ink:#201915;
  --ink-soft:#4b4038;
  --muted:#5c4f3e;
  --line:#c9b691;
  --wine:#6d1f2c;
  --gold:#9c7b2e;
  --serif:'Cormorant Garamond','Noto Serif TC',serif;
  --body:'Noto Serif TC','Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{
  font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(120,95,58,.032) 0 1px,transparent 1px 104px),
    radial-gradient(1200px 820px at 50% -8%,rgba(255,252,244,.72),transparent 64%);
  background-attachment:fixed;line-height:1.8;-webkit-font-smoothing:antialiased;text-wrap:pretty;
}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--wine),rgba(109,31,44,.5));opacity:.92;z-index:60;pointer-events:none}
a{color:var(--wine);text-decoration:none}
a:hover{text-decoration:underline}

/* ── header ── */
header{position:sticky;top:0;z-index:40;background:rgba(245,239,227,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(120,95,58,.22)}
.hbar{max-width:1120px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
.logo{font-family:'Italiana',serif;font-size:1.16rem;letter-spacing:.02em;line-height:1;color:var(--ink);opacity:.93}
.logo i{font-style:normal;color:var(--wine)}
.logo .hy{font-family:Georgia,'Times New Roman',serif;font-size:1.12em;letter-spacing:.04em;vertical-align:-.04em}
.search{margin-left:auto;display:flex;align-items:center;gap:5px}
.search .mag{color:var(--muted);font-size:.95rem;line-height:1}
.search input{width:150px;padding:4px 2px;border:0;border-bottom:1px solid rgba(120,95,58,.5);border-radius:0;
  background:transparent;font-family:var(--body);font-size:.79rem;letter-spacing:.1em;color:var(--ink);outline:none;
  transition:border-color .25s,width .25s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-bottom-color:var(--wine);width:196px}
.langtoggle{display:flex;gap:10px}
.langtoggle button{border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--body);
  font-size:.74rem;letter-spacing:.14em;padding:2px 0;color:var(--muted);cursor:pointer;transition:.25s}
.langtoggle button.on{color:var(--ink);border-bottom-color:var(--wine)}
.langtoggle button:hover:not(.on){color:var(--wine)}

/* ── masthead ── */
.masthead{padding:60px 24px 22px;text-align:center}
.masthead .big{font-family:var(--serif);font-size:clamp(3.8rem,12vw,6.8rem);font-weight:500;line-height:1;
  letter-spacing:.2em;color:var(--ink);text-indent:.2em}
.masthead .sub{font-family:var(--serif);font-size:.92rem;letter-spacing:.36em;color:var(--ink-soft);margin-top:20px}
.masthead .rule{width:34px;height:1px;background:var(--wine);opacity:.6;margin:18px auto 0}

/* ── stats ── */
.stats{max-width:1120px;margin:18px auto 0;padding:0 24px;display:flex;justify-content:center;flex-wrap:wrap;
  border-top:1px solid rgba(120,95,58,.16);border-bottom:1px solid rgba(120,95,58,.16)}
.stat{flex:1 1 0;min-width:120px;text-align:center;padding:16px 8px;border-right:1px solid rgba(120,95,58,.13)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1;color:var(--ink)}
.stat .k{font-size:.67rem;letter-spacing:.18em;color:var(--muted);margin-top:7px}

/* ── coverage ── */
.cov{max-width:1120px;margin:0 auto;padding:34px 24px 6px}
.cov .h{display:flex;align-items:baseline;gap:12px}
.cov .h .k{font-family:var(--serif);font-size:.86rem;letter-spacing:.34em;color:var(--ink-soft)}
.cov .h .n{font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.cov .h .n b{color:var(--wine);font-weight:500}
.cov .h .bar{flex:1;height:2px;background:rgba(120,95,58,.14);margin:0 8px 6px;position:relative;overflow:hidden}
.cov .h .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--wine);width:0;transition:width .8s ease}
.covgroup{margin-top:12px}
.covgroup .gl{font-size:.6rem;letter-spacing:.26em;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.chip{font-size:.73rem;letter-spacing:.03em;color:var(--ink-soft);border:1px solid rgba(120,95,58,.3);
  padding:2px 8px;border-radius:1px;background:rgba(255,252,246,.55);cursor:pointer;transition:.25s}
.chip:hover{border-color:var(--wine);color:var(--wine)}
.chip.have{background:rgba(109,31,44,.9);border-color:var(--wine);color:#fbf3ee}
.chip.p{font-weight:500}
.chip sup{font-size:.5rem;opacity:.6;margin-left:2px}

/* ── filters ── */
.filters{max-width:1100px;margin:26px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;justify-content:center}
.pill{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);padding:3px 1px 4px;
  margin:0 10px;font-family:var(--body);font-size:.79rem;letter-spacing:.13em;cursor:pointer;transition:.25s}
.pill:hover{color:var(--wine);border-bottom-color:rgba(109,31,44,.32)}
.pill.active{color:var(--ink);border-bottom-color:var(--wine);font-weight:500}
.fbar{max-width:1100px;margin:12px auto 0;padding:10px 24px 0;display:flex;gap:6px;justify-content:center;
  align-items:center;flex-wrap:wrap;border-top:1px solid rgba(120,95,58,.14)}
.fbar .lab{font-size:.66rem;color:var(--muted);letter-spacing:.22em;margin-right:6px;white-space:nowrap}

/* ── grid ── */
.sechead{max-width:1120px;margin:0 auto;padding:30px 24px 0;display:flex;align-items:baseline;gap:12px}
.sechead .k{font-family:var(--serif);font-size:.84rem;letter-spacing:.36em;color:var(--ink-soft)}
.sechead .n{font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.sechead .sort{margin-left:auto;font-size:.68rem;color:var(--muted);letter-spacing:.12em;border:0;
  border-bottom:1px solid rgba(120,95,58,.45);background:transparent;padding:2px 0;cursor:pointer;transition:.25s}
.sechead .sort:hover{color:var(--wine);border-bottom-color:var(--wine)}
.typeblock{max-width:1120px;margin:0 auto;padding:0 0 6px}
.typeblock:last-child .grid{padding-bottom:60px}
.typehead{max-width:1120px;margin:0 auto;padding:26px 24px 0;display:flex;align-items:baseline;gap:12px;
  border-bottom:1px solid rgba(70,52,30,.16);padding-bottom:8px}
.typehead .tk{font-family:var(--serif);font-size:.92rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.typehead .tn{font-size:.7rem;color:var(--muted);letter-spacing:.12em}
.grid{max-width:1120px;margin:0 auto;padding:22px 24px 46px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(22px,3.2vw,42px)}
.card{background:var(--washi);border:1px solid rgba(70,52,30,.13);border-radius:1px;overflow:hidden;cursor:pointer;
  display:block;color:inherit;text-decoration:none}
  position:relative;opacity:1;transform:none;transition:transform .5s cubic-bezier(.22,.61,.36,1),
  border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-3px);border-color:rgba(70,52,30,.3);
  box-shadow:0 12px 30px -22px rgba(50,35,15,.45)}
.card:hover .nm{color:var(--wine)}
.card .shot{width:100%;aspect-ratio:3/4;display:block;object-fit:cover;background:var(--paper-2);
  filter:saturate(.74) contrast(1.04) brightness(1.01);
  transition:filter .9s cubic-bezier(.22,.61,.36,1),transform 1.2s cubic-bezier(.22,.61,.36,1)}
.card:hover .shot{filter:saturate(1) contrast(1) brightness(1);transform:scale(1.015)}
.noimg{width:100%;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:linear-gradient(180deg,#f2ead9,#e7dcc5);position:relative;overflow:hidden}
.noimg::after{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,rgba(120,98,64,.05) 0 1px,transparent 1px 5px);opacity:.7}
.noimg .enso{position:absolute;width:62%;height:62%;color:rgba(140,114,74,.28)}
.noimg .btl{position:relative;width:44%;height:auto;color:rgba(96,76,46,.5)}
.noimg .btl{filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.noimg em{position:relative;font-style:normal;font-size:.56rem;letter-spacing:.2em;color:var(--muted);opacity:.75}
.seal{position:absolute;top:11px;right:11px;z-index:2;background:rgba(252,249,242,.94);border:1px solid var(--wine);
  color:var(--wine);font-family:var(--serif);font-size:.82rem;line-height:1;padding:5px 6px;border-radius:1px;
  transform:rotate(-1.5deg);letter-spacing:0}
.tag{position:absolute;top:11px;left:11px;z-index:2;background:rgba(252,249,242,.9);color:var(--wine);
  border:1px solid rgba(109,31,44,.45);font-size:.58rem;letter-spacing:.18em;padding:2px 6px;border-radius:1px}
.body{padding:15px 17px 19px;border-top:1px solid rgba(70,52,30,.09)}
.no{font-family:var(--serif);font-size:.66rem;letter-spacing:.26em;color:var(--wine);margin-bottom:3px}
a.card:hover{text-decoration:none}
.card .go{display:block;text-align:right;font-size:.64rem;letter-spacing:.14em;color:var(--wine);
  opacity:0;transform:translateX(-4px);transition:opacity .35s,transform .35s;margin-top:8px}
.card:hover .go{opacity:.85;transform:none}
a.jrow:hover{text-decoration:none}
.nm{font-family:var(--serif);font-size:1.24rem;font-weight:600;letter-spacing:.03em;line-height:1.35;
  transition:color .35s}
.nmen{font-size:.73rem;color:#5a4c3c;font-style:italic;letter-spacing:.03em;margin-top:2px;line-height:1.5}
.pr{font-size:.78rem;color:#3a2f26;letter-spacing:.04em;margin-top:5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rg{font-size:.74rem;color:#4b4038;letter-spacing:.04em;margin-top:3px}
.gr{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.gr span{font-size:.66rem;color:#3f342b;letter-spacing:.03em;border:1px solid rgba(120,95,58,.34);
  padding:1px 6px;border-radius:1px}
.empty{max-width:1120px;margin:0 auto;padding:40px 24px 70px;text-align:center;color:var(--muted);
  font-size:.82rem;letter-spacing:.14em}

/* ── journal ── */
.journal{max-width:1120px;margin:0 auto;padding:10px 24px 40px}
.jhead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid rgba(70,52,30,.14)}
.jhead .k{font-family:var(--serif);font-size:.82rem;letter-spacing:.36em;color:var(--ink-soft)}
.jhead .n{font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.jrow{display:grid;grid-template-columns:96px 1fr 1fr 56px;gap:12px;padding:10px 6px;margin:0 -6px;
  border-bottom:1px dashed rgba(70,52,30,.13);font-size:.79rem;color:var(--ink-soft);cursor:pointer;
  transition:.25s;text-decoration:none}
.jrow:hover{background:rgba(255,252,246,.7);padding-left:12px}
.jrow:hover .jn{color:var(--wine)}
.jrow .jd{color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.jrow .jn{font-family:var(--serif);font-size:.95rem;color:var(--ink);letter-spacing:.02em;transition:color .25s}
.jrow .jv{color:var(--muted);font-size:.73rem}
.jrow .js{text-align:right;font-family:var(--serif);color:var(--wine);font-size:.86rem}
.jempty{font-size:.75rem;color:var(--muted);letter-spacing:.12em;padding:14px 0}

footer{text-align:center;padding:34px 24px 56px;color:var(--muted);font-size:.67rem;letter-spacing:.14em;line-height:2.2}
footer .dot{opacity:.4;margin:0 6px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
@media(max-width:560px){
  .masthead{padding:46px 20px 20px}
  .grid{padding:20px 16px 60px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .nm{font-size:1.02rem}
  .stat .v{font-size:1.35rem}
  .hbar{padding:10px 14px;gap:10px}
  .search input{width:104px}.search input:focus{width:126px}
  .jrow{grid-template-columns:74px 1fr 48px;font-size:.74rem}
  .jrow .jv{display:none}
  .rows{grid-template-columns:1fr}
  .chip{font-size:.74rem;padding:4px 9px}
  .grid{gap:14px}
}
</style>
</head>

<header>
  <div class="hbar">
    <div class="logo">j<span class="hy">-</span><i>drinking</i></div>

const TASTINGS = [{"name":"Clase Azul Reposado","name_en":"Clase Azul Reposado — 100% blue Weber agave tequila, 8 months in American whiskey casks","lang":"es","type":"spirit","country":"Mexico","region":"Jalisco","appellation":"Tequila","grapes":[],"abv":40,"price":1780,"currency":"HKD","venue":"","occasion":"","photo":"images/tastings/undated-01.jpg","sat":{},"score":null,"note":"Pale gold; medium to full body. Cooked agave and agave nectar lead, with candied orange peel, toasted wood and a subtle hazelnut note from the American whiskey casks.","id":"undated-01","background":"Clase Azul started in Guadalajara in 1997, when Arturo Lomelí bottled tequila in hand-made ceramic rather than glass. Each decanter is shaped and painted by Mazahua artisans in Santa María Canchesdá and takes about two weeks to finish — which is why the empties end up on shelves instead of in the recycling.\n\nThe agave is 100% blue Weber from Los Altos de Jalisco, slow-cooked before fermentation; this reposado rests eight months in American whiskey casks — enough for vanilla and hazelnut, not enough to bury the cooked agave.","sources":"claseazul.com (production, tasting notes) · Barron's & Forbes (founding, 1997) · Vinfolio / Tasting Table / The Times (Santa María Canchesdá decanters, ~2 weeks each)","note_src":"Producer's tasting notes — claseazul.com","keywords":["cooked agave","agave nectar","candied orange peel","toasted wood","hazelnut"],"keywords_src":"producer's tasting notes","price_src":"Liquidz HK, HK$1,780 (750 ml) — also listed at HK$1,980 at hkonlinewineshop; checked 2026-10-28","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"A reposado tequila from the Jalisco highlands: 100% blue Weber agave, slow-cooked, then rested eight months in American whiskey casks. Sold in a hand-painted ceramic decanter.","photo_src":"img_c6a6921ccde9.jpg","no":1,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Les Folatières","name_en":"Puligny-Montrachet Premier Cru 'Les Folatières' — Chardonnay from the largest premier cru in Puligny, Côte de Beaune","lang":"fr","producer":"François Carillon","vintage":2023,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":1870,"currency":"HKD","venue":"","occasion":"","photo":"images/tastings/undated-02.jpg","sat":{},"score":null,"note":"","note_src":"","background":"The Carillon name has farmed Puligny for roughly four centuries — “1611” is the date they print on the label. The domaine itself dates from 2010, when Louis Carillon retired and the estate split amicably between his sons François and Jacques; both labels still carry the same weight in the village.\n\nLes Folatières is Puligny's largest premier cru: a steep east-to-south-east slope at about 276 m, thin soil over limestone scree. It ripens early, so the wines come out broader than the village's tightest premiers crus — stone fruit and honeysuckle rather than the razor edge of a Pucelles.\n\n2023 was Burgundy's warmest year on record. The whites came in generous in fruit and volume, the risk being low acid and high alcohol where picking ran late; the best kept a racy line under all that richness.","sources":"francoiscarillon.com (domaine 2010; family in Puligny, “1611” on the label) · The Drinks Business / Decanter (2010 split with Jacques Carillon) · Terroirium & Olivier Leflaive (Les Folatières: largest 1er cru, ~276 m, east/south-east, limestone scree) · Berry Bros. & Rudd, Decanter, JancisRobinson.com (vintage 2023)","id":"undated-02","keywords":["honeysuckle","white peach","crushed chalk","toasted hazelnut","racy acidity"],"keywords_src":"critic descriptors for Carillon Les Folatières (Jasper Morris MW and others)","price_src":"Grape n Grain HK, HK$1,870 (750 ml) — Enoteca HK lists HK$2,200; checked 2026-10-28","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"White Burgundy from Puligny's largest premier cru — Chardonnay off the limestone scree of Les Folatières, in a warm vintage that gives breadth under the acidity.","photo_src":"img_fd009909ee12.jpg","no":2,"date_disp":"28 Oct 2026*"},{"name":"Krug Grande Cuvée 173ème Édition","name_en":"Krug Grande Cuvée 173ème Édition — multi-vintage Brut Champagne, blended around the 2017 harvest","lang":"fr","producer":"Krug","vintage":null,"type":"sparkling","country":"France","region":"Champagne · Reims","appellation":"Champagne AOC","grapes":["Chardonnay","Pinot Noir","Meunier"],"abv":12.5,"price":1980,"currency":"HKD","price_src":"Feast Market HK, HK$1,980 (750 ml), checked 2026-10-28 — hkonlinewineshop listed HK$1,458 on the same check","venue":"","occasion":"","photo":"images/tastings/undated-03.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["toast","brioche","stone fruit","vanilla cream","crisp lemon finish"],"keywords_src":"Krug official tasting notes for the 173ème Édition","background":"Grande Cuvée is rebuilt every year rather than being a fixed recipe. The 173ème Édition is composed around the 2017 harvest: 150 wines from 13 different vintages, the youngest 2017, blended so that the house style — not the year — is what you taste. That vertical blending is the entire Krug argument, and it is why the label carries an edition number instead of a vintage.\n\nThe wine is fermented and raised in oak and then spends years on its lees before release, which is where the toast and pastry weight comes from. It drinks like white Burgundy with bubbles: unctuous and creamy, then a crisp lemon finish that resets the palate.","sources":"krug.com (173ème Édition: 150 wines, 13 vintages, base 2017; tasting notes) · Feast Market HK listing (price)","id":"undated-03","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"Krug's multi-vintage flagship, built around the 2017 harvest from 150 wines across 13 years. Full-bodied, brioche-led Champagne designed as a house style rather than a vintage.","photo_src":"img_1fea6e39a9b5.jpg","no":3,"date_disp":"28 Oct 2026*"},{"name":"Riserva Lunelli 2016","name_en":"Ferrari Riserva Lunelli 2016 — Trentodoc Extra Brut, 100% Chardonnay, 69 months on the lees","lang":"it","producer":"Ferrari Trento","vintage":2016,"type":"sparkling","country":"Italy","region":"Trentino · Trento","appellation":"Trentodoc DOC","grapes":["Chardonnay"],"abv":12.5,"price":690,"currency":"HKD","price_src":"RNG Wine HK lists the 2015 at HK$690 (750 ml); the 2016 is not currently listed in HK — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/undated-04.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["crème brûlée","ripe apricot","smoke","vanilla","jasmine"],"keywords_src":"Ferrari official tasting note for Riserva Lunelli 2016","background":"Ferrari was founded in Trento in 1902 and is Italy's reference traditional-method sparkling house; the label still says “dal 1902”. Riserva Lunelli is the family's own cuvée — 100% Chardonnay from mountain vineyards, picked by hand, and the only Ferrari whose first fermentation happens in large Austrian oak casks, the way it was done in Bruno Lunelli's time.\n\nIt rests a minimum of 69 months on the lees, so a 2016 is only now arriving in condition. Expect gold, smoke and crème brûlée over ripe apricot, with mountain acidity holding the richness in place — Italy's answer to Champagne, from a colder, higher place.","sources":"ferraritrento.com technical sheet for Riserva Lunelli 2016 (69 months, oak fermentation, 12.5%, tasting note) · RNG Wine HK (price)","id":"undated-04","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"A vintage Trentodoc from Ferrari's own mountain Chardonnay, fermented in Austrian oak and left 69 months on the lees — the most Burgundian wine in the range.","photo_src":"img_891b5fd18947.jpg","no":4,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Champ Gain","name_en":"Olivier Leflaive, Puligny-Montrachet Premier Cru 'Champ Gain' — Chardonnay from Puligny's upper slope","lang":"fr","producer":"Olivier Leflaive","vintage":null,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":1380,"currency":"HKD","price_src":"RNG Wine HK, Olivier Leflaive Puligny 1er Cru Champ Gain 2022, HK$1,380 (750 ml), checked 2026-10-28 — vintage on your bottle is not visible","venue":"","occasion":"","photo":"images/tastings/undated-05.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["white peach","hazelnut","wet stone","honeysuckle","firm acidity"],"keywords_src":"Climat and producer profiles for Champ Gain (Olivier Leflaive technical sheet; Puligny reference notes)","background":"Champ Gain takes its name from fields won back from the forest and then planted to vine — a 10.7-hectare premier cru on Puligny's upper slope, sitting at 250–300 m. Higher and cooler than the famous middle vineyards of the village, it gives a Puligny with more tension than plushness.\n\nOlivier Leflaive runs a négociant house in Puligny — the Leflaive name is the same family as Domaine Leflaive, a different business. He buys grapes and must from growers he has contracted for years and makes the wine in his own cellar, which is how a premier cru from this address reaches a shelf without grand cru pricing.","sources":"olivier-leflaive.com (Champ Gain: name origin, climat) · vincod technical sheet (10.7 ha, 250–300 m) · RNG Wine HK (price)","id":"undated-05","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"Premier cru Puligny from Champ Gain, high on the slope. Olivier Leflaive buys the fruit and makes a tighter, more chiselled wine than the village's famous middle vineyards.","photo_src":"img_53f42593cb2b.jpg","no":5,"date_disp":"28 Oct 2026*"},{"name":"Puligny-Montrachet 1er Cru Les Chalumaux","name_en":"Domaine de la Choupette, Puligny-Montrachet Premier Cru 'Les Chalumaux' 2023 — Chardonnay","lang":"fr","producer":"Domaine de la Choupette","vintage":2023,"type":"white","country":"France","region":"Burgundy · Côte de Beaune · Puligny-Montrachet","appellation":"Puligny-Montrachet Premier Cru","grapes":["Chardonnay"],"abv":null,"price":880,"currency":"HKD","price_src":"YOHO Hong Kong lists the 2022 at HK$880 (750 ml, currently out of stock); the 2023 has no HK listing yet — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/undated-06.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe white fruit","vanilla","roasted hazelnut","floral","saline finish"],"keywords_src":"Importer tasting note for Domaine de la Choupette Les Chalumaux (2022, same cuvée)","background":"Domaine de la Choupette is in Santenay, at the southern end of the Côte de Beaune, run by twin brothers Jean-Christophe and Philippe Gutrin. They farm traditionally and hold HVE 3 (high environmental value) certification since 2022 — a small family domaine bottling a Puligny premier cru from bought fruit.\n\nLes Chalumaux sits at the Meursault end of Puligny, lower on the slope than the great middle vineyards, so the wine tends broader and nuttier than a limestone-driven site like Folatières up the hill. In practice: ripe white fruit, a vanilla-and-hazelnut edge from oak, and a saline finish — Puligny in a softer register.","sources":"Domaine de la Choupette / importer notes (Santenay, Gutrin twins, HVE 3 since 2022, tasting note) · YOHO Hong Kong (price) · Wine-Searcher (Les Chalumaux climat)","id":"undated-06","date":"2026-10-28","date_guess":true,"added":"2026-10-28","description":"A small-domaine Puligny premier cru from Les Chalumaux, at the Meursault end of the village: broader and nuttier than the limestone sites up the hill.","photo_src":"img_449cf159e67a.jpg","no":6,"date_disp":"28 Oct 2026*"},{"name":"Grand Vin de Léoville du Marquis de Las Cases","name_en":"Château Léoville Las Cases, Saint-Julien 2ème Cru Classé 1998 — Cabernet-dominant Bordeaux from the Delon family","lang":"fr","producer":"Château Léoville Las Cases","vintage":1998,"type":"red","country":"France","region":"Bordeaux · Saint-Julien","appellation":"Saint-Julien AOC","grapes":["Cabernet Sauvignon","Merlot"],"abv":13.0,"price":2385,"currency":"HKD","price_src":"Millesima Hong Kong, HK$7,154 for a 3-bottle case = HK$2,384.67 per bottle, checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-01.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["black cherry","lead pencil","graphite","smoke","firm tannin"],"keywords_src":"Christie's tasting note for the 1998","background":"Léoville Las Cases is one of the oldest estates in the Médoc — the Domaine de Léoville was split three ways after the Revolution, and this is the piece that kept the château and the best terroir, right up against Latour's enclosure. It was classed 2ème Cru in 1855 and has spent the last century behaving like something better; the Delon family have run it since the early 1900s, today under Jean-Hubert Delon.\n\n1998 was a Cabernet year on the Left Bank, and this is one of the wines that proves it: cassis and black cherry under a wall of tannin, with the lead-pencil and graphite signature that Las Cases always gives. It is 27 years old and still climbing — the sort of bottle you decant for an hour and then wish you had opened five years ago.","sources":"Christie's lot note (tasting note) · domaines-delon.com / Wikipedia (estate history, 1855 classification) · Bordeaux Index (13.0% ABV) · Millesima HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-01","description":"Saint-Julien from the Delon family's Léoville Las Cases — Cabernet-dominant, famously long-lived, and still firm at 27 years old.","photo_src":"img_6d698a06ab31.jpg","no":7,"date_disp":"28 Oct 2026*"},{"name":"Vosne-Romanée 1er Cru Les Chaumes","name_en":"Domaine Méo-Camuzet, Vosne-Romanée Premier Cru 'Les Chaumes' 2023 — Pinot Noir from the lower slope","lang":"fr","producer":"Domaine Méo-Camuzet","vintage":2023,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Vosne-Romanée","appellation":"Vosne-Romanée Premier Cru","grapes":["Pinot Noir"],"abv":null,"price":1650,"currency":"HKD","price_src":"No 2023 listing in Hong Kong yet; Burgundy Cave HK offered the 2021 Les Chaumes at HK$1,650–1,700 per bottle (Oct 2024) — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-02.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe red fruit","black fruit","new oak","sweet spice","fresh acidity"],"keywords_src":"Domaine Méo-Camuzet tasting note for the 2023 Vosne-Romanée","background":"Méo-Camuzet's vines came to the family through Étienne Camuzet, the Vosne politician who bought the Château du Clos de Vougeot in 1920. For decades the vineyards were farmed by Henri Jayer as métayer — the arrangement that produced some of the most famous Burgundies never sold under his own name — and Jean-Nicolas Méo took the domaine over in 1989 with Jayer still looking over his shoulder.\n\nLes Chaumes sits low on the slope at the Nuits end of Vosne, which is why it is usually the most open and least austere of the village's premiers crus. In 2023 the fruit is ripe and lifted, the new oak still showing its spice — a Vosne built for ten years rather than thirty.","sources":"meo-camuzet.com (estate history, Les Chaumes, 2023 tasting note) · Burgundy Cave HK (price reference)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-02","description":"Vosne-Romanée premier cru from the lower slope: the most open of the village's premiers crus, from the domaine Henri Jayer once farmed.","photo_src":"img_2fa5e2e73238.jpg","no":8,"date_disp":"28 Oct 2026*"},{"name":"Clos des Goisses","name_en":"Philipponnat Clos des Goisses 2003 — single-vineyard Brut Champagne from the steepest slope in the region","lang":"fr","producer":"Philipponnat","vintage":2003,"type":"sparkling","country":"France","region":"Champagne · Mareuil-sur-Aÿ","appellation":"Champagne AOC","grapes":["Pinot Noir","Chardonnay"],"abv":12.0,"price":1980,"currency":"HKD","price_src":"Burgundy Cave HK, HK$1,980 per bottle (Jan 2024 offer), checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-03.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["ripe peach","honey","toasted hazelnut","creamy mousse","soft acidity"],"keywords_src":"Climat and vintage profile for Clos des Goisses 2003 (Essi Avellan scored it 91–93)","background":"Clos des Goisses is a 5.83-hectare walled vineyard in Mareuil-sur-Aÿ, planted on a 45° slope that drops toward the Marne — the steepest vineyard in Champagne, and one of the oldest clos in the region. Philipponnat has owned it for nearly a century, and it is the only Champagne house whose flagship is a single walled plot rather than a blend of villages.\n\n2003 was the heatwave year: sugar without much acid, and a Champagne that came out broad, honeyed and Pinot-driven rather than sharp. Roughly two-thirds Pinot Noir to one-third Chardonnay here, which is why it reads more like a white Burgundy with bubbles than an aperitif.","sources":"philipponnat.com (5.83 ha walled clos, 45° slope, Mareuil-sur-Aÿ) · Essi Avellan (2003: 65% Pinot Noir / 35% Chardonnay, 91–93 pts) · Burgundy Cave HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-03","description":"Philipponnat's single walled vineyard in Mareuil-sur-Aÿ, on Champagne's steepest slope. The 2003 is a broad, honeyed, Pinot-driven vintage.","photo_src":"img_2f6ff35abae0.jpg","no":9,"date_disp":"28 Oct 2026*"},{"name":"Chambertin-Clos de Bèze Grand Cru","name_en":"Domaine Faiveley, Chambertin-Clos de Bèze Grand Cru 2015 — bottle No. 0636 of 3,022","lang":"fr","producer":"Domaine Faiveley","vintage":2015,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Gevrey-Chambertin","appellation":"Chambertin-Clos de Bèze Grand Cru","grapes":["Pinot Noir"],"abv":null,"price":4129,"currency":"HKD","price_src":"Crop & Vine HK, HK$24,772 for a 6-bottle case = HK$4,128.67 per bottle, checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-04.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["dark cherry","rose petal","liquorice","savoury earth","firm tannin"],"keywords_src":"Climat and vintage profile for Clos de Bèze 2015 (critics scored it 93–98)","background":"Faiveley has been a négociant house in Nuits-Saint-Georges since 1825, and it is now in its seventh generation with Erwan Faiveley running it. Clos de Bèze is the other great grand cru of Gevrey-Chambertin, 15.4 hectares lying above Chambertin itself, and the two have been argued over for two centuries as to which is finer.\n\nThe label is unusually honest: 3,022 bottles from this harvest, this one No. 0636, bottled at the domaine. 2015 was a warm, concentrated vintage in the Côte de Nuits, and Clos de Bèze carried it well — rose and dark cherry over a firm, savoury spine.","sources":"Label (3,022 bottles, No. 0636, mis en bouteille au domaine) · Decanter (Clos de Bèze 15.4 ha) · Atlas Fine Wines / Burghound (Erwan Faiveley, 7th generation; 93–96) · Crop & Vine HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-04","description":"Grand cru Gevrey-Chambertin from Clos de Bèze, the 15.4-hectare site above Chambertin. Warm 2015: rose and dark cherry over a firm spine.","photo_src":"img_f254f8bc61b3.jpg","no":10,"date_disp":"28 Oct 2026*"},{"name":"Griotte-Chambertin Grand Cru","name_en":"Domaine Ponsot, Griotte-Chambertin Grand Cru 2014 — the smallest of the Gevrey grands crus","lang":"fr","producer":"Domaine Ponsot","vintage":2014,"type":"red","country":"France","region":"Burgundy · Côte de Nuits · Gevrey-Chambertin","appellation":"Griotte-Chambertin Grand Cru","grapes":["Pinot Noir"],"abv":13.5,"price":4688,"currency":"HKD","price_src":"TwoMoreGlasses HK, HK$4,688 per bottle (75 cl), checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-05.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["morello cherry","rose","forest floor","fine tannin","fresh acidity"],"keywords_src":"Climat and vintage profile for Griotte-Chambertin 2014 (Robert Parker 94)","background":"Domaine Ponsot was founded in Morey-Saint-Denis in 1872 by William Ponsot, and the family has held vines in the great sites of the village ever since. Griotte-Chambertin is the smallest of Gevrey's grands crus at 2.69 hectares, and Ponsot is one of the few owners with a serious holding — the name comes from the griotte, the sour morello cherry the wine is supposed to resemble rather than any cherry in the ground.\n\nThis 2014 was made while Laurent Ponsot still ran the domaine, before he left in 2017 to bottle under his own name. Cool vintage, small crop: red-fruited and lifted rather than powerful, which is exactly the register Griotte is prized for.","sources":"Domaine Ponsot / Goedhuis (founded 1872 by William Ponsot) · Decanter (Griotte-Chambertin 2.69 ha) · Wine Investment / RP (94 pts, 13.5%) · TwoMoreGlasses HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-05","description":"The smallest grand cru of Gevrey, from Ponsot's holding in Griotte-Chambertin — red-fruited, lifted and fine rather than powerful.","photo_src":"img_e991f2f2dfdb.jpg","no":11,"date_disp":"28 Oct 2026*"},{"name":"贵州茅台酒","name_en":"Kweichow Moutai 「飞天」 — sauce-aroma baijiu, 53% vol, 500 ml","lang":"zh","producer":"Kweichow Moutai Co., Ltd.","vintage":null,"type":"baijiu","country":"China","region":"Guizhou · Maotai town, Renhuai","appellation":"贵州茅台酒 GI","grapes":[],"base":"sorghum, wheat, water","abv":53,"price":2149,"currency":"HKD","price_src":"Remfly HK, HK$2,149 (2025 bottling, 500 ml), checked 2026-10-28 — Richbrighten HK lists HK$2,699 and moutaionly HK$2,180 for 2024/2025","venue":"","occasion":"","photo":"images/tastings/2026-10-28-06.jpg","sat":{},"score":null,"keywords":["sauce aroma","dried fruit","toasted nuts","dried botanicals","long finish"],"keywords_src":"Moutai back label — the nine fragrance families it names (酱香突出, flowers, fruit, dried botanicals, nuts)","description":"China's benchmark spirit: a sauce-aroma baijiu distilled from sorghum and wheat in Maotai town, Guizhou, bottled at 53% after a production cycle measured in years rather than months.","background":"Moutai is not a brand name that can be borrowed: only baijiu made in the town of Maotai, on the Chishui river in Guizhou, may carry it. The town's humidity, its water and its local qu (the fermentation starter) are treated as the reason the spirit tastes the way it does, and the 「飞天」 Flying Fairy label is the export-facing one — the same liquid as the domestic star label, different politics.\n\nThe cycle is slow by any standard: the qu is made in summer, the sorghum is fermented and distilled over the following year, and the spirit is then blended and rested — at least five years from start to bottle. 53% vol is not an accident either; it is the strength at which the aroma compounds stay in solution, which is why Moutai is drunk in tiny cups rather than poured over ice.\n\nThe back of the box is unusually plain-spoken for a luxury brand: 酱香型白酒 under standard GB/T 18356, licence SC11552038220099, glutinous sorghum, wheat and water only, five years, and — in the label's own words — no added aromas or flavourings. It then describes its own bouquet as nine families of fragrance, flowers and fruit and dried botanicals and nuts among them. That is the most precise tasting note Moutai has ever published about itself.","sources":"Oxford Companion to Spirits & Cocktails (flagship 53% abv, China's most valuable spirits brand) · The Drinks Business (only Maotai town production may use the name) · CGTN (five-year production cycle) · D&D Liquor (sorghum, wheat, water; sauce-aroma) · Remfly / Richbrighten / moutaionly HK (prices) · Back label (GB/T 18356, SC11552038220099, 53% vol / 106 proof / 500 ml, GI 9152000071430580XT)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-06","extra_note":"Production date is printed as a spray code on the cap (生产日期：见瓶盖喷码) — not recorded yet.","photo_src":"img_92b37a0f0e8c.jpg","no":12,"date_disp":"28 Oct 2026*"},{"name":"十四代 超極 中取り しぼりたて","name_en":"Juyondai Chōkyoku Nakadori Shiboritate — junmai daiginjo, 35%, freshly pressed (Takagi Shuzo, Yamagata)","lang":"ja","producer":"高木酒造 (Takagi Shuzo)","vintage":null,"type":"sake","country":"Japan","region":"Yamagata · Murayama","appellation":"純米大吟醸 (junmai daiginjo)","grapes":[],"base":"rice — 山田錦 (Hyogo, special-A district), milled to 35%","abv":16,"price":2280,"currency":"HKD","price_src":"HY1972 HK, HK$2,280 (720 ml, in stock), checked 2026-10-28 — 酒蛙 Sakewa lists it at HK$2,388 and Wine Galaxy at HK$2,380","venue":"","occasion":"","photo":"images/tastings/2026-10-28-07.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["melon","white peach","lychee","silky texture","fresh acidity"],"keywords_src":"Juyondai 超極 profile (fragrant fruit, soft finish) and Sakenomy's note for this bottling","description":"Juyondai's top-grade junmai daiginjo, taken from the middle cut of the press and bottled fresh — Hyogo Yamadanishiki milled to 35%, 16% alcohol, no pasteurisation to speak of.","background":"高木酒造 has brewed in Murayama since 1615. 超極 — renamed from 超特撰 in May 2025 — is the highest grade in the Juyondai line: Yamadanishiki from the special-A districts of Hyogo, milled to 35%, fermented as junmai daiginjo and, in this bottling, しぼりたて: bottled straight off the press without the resting most sake gets.\n\n中取り is the middle fraction of the press, the part the brewer keeps for the top bottling because it runs clearest and least astringent. It is the reason this drinks rounder than the grade suggests.","sources":"sake-suggest / Sakenomy (35%, 16%, nihonshu-do +2, acidity 1.5, 超特撰 renamed 超極 in May 2025) · Sake & Me (Hyogo special-A Yamadanishiki, 35%) · HY1972 / Sakewa / Wine Galaxy HK (prices)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-07","photo_src":"img_5568926fcef7.jpg","no":13,"date_disp":"28 Oct 2026*"},{"name":"山形正宗 純米吟醸 亀ノ尾","name_en":"Yamagata Masamune Junmai Ginjo Kamenoo — Mitobe Shuzo, Tendo, Yamagata","lang":"ja","producer":"水戸部酒造 (Mitobe Shuzo)","vintage":null,"type":"sake","country":"Japan","region":"Yamagata · Tendo","appellation":"純米吟醸 (junmai ginjo)","grapes":[],"base":"rice — 亀ノ尾 (Kamenoo, Yamagata), milled to 50%","abv":16,"price":288,"currency":"HKD","price_src":"明記辦館 Ming Kee Store, HK$288 (list HK$328), 720 ml, listed sold out at check 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-08.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["wild rice","firm acidity","savoury depth","medium body","long finish"],"keywords_src":"Brewery note as carried by Kamoshika-ya (rustic rice flavour, thickness, firm acidity, medium mouthfeel)","description":"Junmai ginjo brewed entirely from Kamenoo, Yamagata's historic landrace, milled to 50% — broader and more savoury than the house's flagship Omachi bottling.","background":"Mitobe Shuzo has brewed in Tendo since 1898 and is one of the few Yamagata breweries fermenting with hard water (around 120 hardness), which gives 山形正宗 its reputation for a sharp, sword-like finish. Everything has been junmai since 2010, pressed slowly in wooden fune boxes, with some 850 ares of the family's own rice.\n\nKamenoo is the Meiji-era Yamagata landrace from which much of eastern Japan's rice descends, used here alone at 50% polish. It is a limited seasonal bottling rather than the year-round Omachi junmai ginjo.","sources":"kamosika.co.jp quoting the brewery (Kamenoo 100%, 50%, 16%) · onesipsake.com (1898, hardness 120, all-junmai since 2010, fune press) · Ming Kee Store HK (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-08","photo_src":"img_e8ebdddcd8e5.jpg","no":14,"date_disp":"28 Oct 2026*"},{"name":"鍋島 純米大吟醸 山田錦45","name_en":"Nabeshima Junmai Daiginjo Yamadanishiki 45 — Yoshikawa-grown, Fukuchiyo Shuzo, Saga","lang":"ja","producer":"富久千代酒造 (Fukuchiyo Shuzo)","vintage":null,"type":"sake","country":"Japan","region":"Saga · Kashima","appellation":"純米大吟醸 (junmai daiginjo)","grapes":[],"base":"rice — 山田錦, milled to 45%","abv":16,"price":568,"currency":"HKD","price_src":"酒蛙 Sakewa HK, HK$568 (list HK$628), 720 ml, checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-09.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["white blossom","pear","rice umami","lactic creaminess","mineral finish"],"keywords_src":"Sakewa tasting note on the product page","description":"Junmai daiginjo from Nabeshima's single-rice series: Yamadanishiki from the Yoshikawa district of Hyogo, milled to 45% — the drier, more mineral side of the house.","background":"Fukuchiyo Shuzo was founded in 1923 on the Ariake Sea coast at Kashima in Saga and launched 鍋島 in 1998; its Champion Sake award at the IWC in 2011 turned a small Kyushu brewery into one of Japan's most wanted labels. The house works by matching individual rice varieties to their own expressions rather than one fixed profile.\n\nThis bottling takes Yamadanishiki from Yoshikawa in Hyogo, a special-A district, mills it to 45% and ferments to 16%. At ¥3,680 per 720 ml in Japan it sits mid-tier in the premium line — above the junmai ginjo, below the 35% daiginjo and the shizuku drips.","sources":"nabeshima.biz (lineup, Yamadanishiki 35%/45%, ¥3,680/720ml, 1923 founding, IWC 2011) · sakewa.hk (Yoshikawa Yamadanishiki, 45%, 16%, HK$568)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-09","photo_src":"img_0dfe61fc202a.jpg","no":15,"date_disp":"28 Oct 2026*"},{"name":"IWA 5 アッサンブラージュ5","name_en":"IWA 5 Assemblage 5 — junmai daiginjo by Shiraiwa K.K., Tateyama, Toyama","lang":"ja","producer":"株式会社白岩 (Shiraiwa K.K.)","vintage":2023,"type":"sake","country":"Japan","region":"Toyama · Tateyama, Shiraiwa","appellation":"純米大吟醸 (junmai daiginjo)","grapes":[],"base":"rice — 山田錦, 雄町, 五百万石; every component milled to 35%","abv":15,"price":1180,"currency":"HKD","price_src":"AMALL 清酒專門店 HK, HK$1,180 (720 ml), checked 2026-10-28; IWA's own HK shop lists the gift-box version at HK$1,118, sold out","venue":"","occasion":"","photo":"images/tastings/2026-10-28-10.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["pear","raspberry","rose petal","silky texture","white pepper"],"keywords_src":"IWA official sensory profile for Assemblage 5","description":"Assemblage 5 is the 2023 cuvée: separately brewed components from three rice varieties and five yeasts, blended and bottled at 15% — Champagne logic applied to sake.","background":"IWA is made by Shiraiwa K.K., a kura built from scratch at Shiraiwa in Tateyama, Toyama, in a building by Kengo Kuma, and founded by Richard Geoffroy after 28 years as the fifth chef de cave of Dom Pérignon. The first IWA 5 was released in 2020; the number marks the fifth assemblage, not a polishing ratio.\n\nEach component is brewed separately — Yamadanishiki from Hyogo and Toyama, Omachi from Okayama, Gohyakumangoku from Toyama, five yeasts including experimental strains, mostly kimoto starters — then blended with reserve sakes. Everything is milled to 35%, brewed as junmai daiginjo with no added alcohol, and pasteurised.","sources":"iwa-sake.jp/a5 (assemblage composition) · prtimes.jp (Shiraiwa K.K., Assemblage 5, fifth release) · sake-times / Sotheby's (Geoffroy, Kengo Kuma kura) · amall.com.hk (price)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-10","photo_src":"img_0b0f161cd185.jpg","no":16,"date_disp":"28 Oct 2026*"},{"name":"十四代 酒未来 大極上諸白","name_en":"Juyondai Sake Mirai Ōgokujō Morohaku — junmai daiginjo, 35%, Takagi Shuzo","lang":"ja","producer":"高木酒造 (Takagi Shuzo)","vintage":null,"type":"sake","country":"Japan","region":"Yamagata · Murayama","appellation":"純米大吟醸 (junmai daiginjo)","grapes":[],"base":"rice — 酒未来, milled to 35%; 生詰 (pasteurised once, at bottling)","abv":15,"price":2788,"currency":"HKD","price_src":"酒蛙 Sakewa HK, HK$2,788 for the 大極上諸白 純米大吟釀 生詰 720 ml gift box, in stock; Greater Bay Sake lists the same 720 ml at HK$2,289 (checked 2026-10-28)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-11.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["melon","ripe pear","tropical fruit","silky texture","gentle acidity"],"keywords_src":"Retailer tasting notes (LovenSake, Sakewa): melon, ripe pear and tropical sweetness, soft on the palate","description":"The most allocated sake in Japan: Takagi Shuzo's junmai daiginjo from the 酒未来 rice it developed itself, milled to 35% and bottled once-pasteurised.","background":"Takagi Shuzo has brewed in Murayama since 1615; the 十四代 name was originally used for the family's aged sake and was carried over when the modern brand launched in 1994, breaking with the then-dominant light-dry style in favour of aromatic, umami-rich sake. The brewery also releases the local label 朝日鷹.\n\n酒未来 is Takagi Shuzo's own rice, bred over roughly 18 years from Miyama Nishiki and Yamazake No.4 and named \"the future of sake\". Within the range the Sake Mirai bottlings differ by press and polish: 大極上諸白 at 35% (this one) and 中取り上諸白 at 45%, both junmai daiginjo around 15% ABV.","sources":"Takagi Shuzo (1615, 酒未来 breeding, 大極上諸白 35% / 中取り上諸白 45%) · LovenSake & Sakewa (tasting notes, prices) · Greater Bay Sake (HK$2,289)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-11","photo_src":"img_8eefc11cbf26.jpg","no":17,"date_disp":"28 Oct 2026*"},{"name":"Sandalford Sparkling Chardonnay Pinot Noir","name_en":"Sandalford NV sparkling Chardonnay–Pinot Noir, Swan Valley, Western Australia","lang":"en","producer":"Sandalford Wines","vintage":null,"type":"sparkling","country":"Australia","region":"Western Australia · Swan Valley","appellation":"South Eastern Australia","grapes":["Chardonnay","Pinot Noir"],"abv":null,"price":null,"currency":"HKD","price_src":"No Hong Kong listing found. Producer's own shop: A$41.00 per bottle / A$492 per case of 12 (checked 2026-10-28)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-12.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["lemon","strawberry","brioche","creamy lees","crisp"],"keywords_src":"Sandalford's own tasting note","description":"A non-vintage Australian sparkling from Chardonnay and Pinot Noir — citrus and red berries over a creamy lees edge, built as house bubbly rather than a trophy.","background":"Sandalford's Caversham estate in the Swan Valley goes back to an 1840 land grant to John Septimus Roe, Western Australia's first Surveyor-General, which makes it one of the state's oldest wineries; it also owns vineyards in Wilyabrup, Margaret River. The non-vintage sparkling is the entry bubbly, poured by the glass at the estate restaurant.\n\nThe fruit is picked early for sparkling, chilled, whole-bunch pressed and cool-fermented separately before blending; sugar and yeast start the second fermentation, and the wine spends time on lees. Sandalford does not publish whether that second fermentation happens in tank or bottle, and no ABV is stated — so both stay unconfirmed here.","sources":"shop.sandalford.com (A$41, winemaking note) · Sandalford estate history (1840 grant, Caversham)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-12","photo_src":"img_53df091deb10.jpg","no":18,"date_disp":"28 Oct 2026*"},{"name":"Maso Martis DosaggioZero Riserva","name_en":"Maso Martis DosaggioZero Riserva Trentodoc — pas dosé, Stelzer family, Trentino","lang":"it","producer":"Maso Martis (Stelzer family)","vintage":null,"type":"sparkling","country":"Italy","region":"Trentino · Martignano, Monte Calisio","appellation":"Trento DOC (Trentodoc)","grapes":["Pinot Noir","Chardonnay"],"abv":12.5,"price":null,"currency":"HKD","price_src":"No Hong Kong listing found. Producer's shop: €40.50 for the DosaggioZero Riserva Millesimato Bio 750 ml, current release 2021 (checked 2026-10-28)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-13.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["yeast","almond","hazelnut","saline","mineral"],"keywords_src":"Maso Martis technical sheet for DosaggioZero","description":"Zero-dosage Trentodoc Riserva from organically farmed Pinot Nero and Chardonnay, 36 months on the lees and disgorged with no liqueur — dry, saline, mineral.","background":"Maso Martis was founded in 1990 by Antonio Stelzer and Roberta Giuriali at Martignano, about 450 m up Monte Calisio above Trento, and works almost only in classic-method sparkling from its own organic vineyards. DosaggioZero was among the first pas dosé metodo classico wines made in Trentino.\n\nPinot Nero ferments and ages in steel, Chardonnay for about eight months in oak, and the cuvée goes to tirage the following spring. At least 36 months on the lees, manual riddling, disgorgement with no liqueur d'expédition — 12.5% and vintage-dated (millesimato).","sources":"masomartis.it technical sheet and shop (€40.50, 2021, 36 months, 12.5%, organic)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-13","photo_src":"img_c3c9f7f124f4.jpg","no":19,"date_disp":"28 Oct 2026*"},{"name":"Officina del Vento Sicilia DOC","name_en":"Officina del Vento Grillo Sicilia DOC 2024 — Stagnone di Marsala, by three Italian MWs","lang":"it","producer":"Officina del Vento (Gorelli, Lonardi, Russo)","vintage":2024,"type":"white","country":"Italy","region":"Sicily · Stagnone di Marsala","appellation":"Sicilia DOC","grapes":["Grillo"],"abv":13,"price":1110,"currency":"HKD","price_src":"Beyond Wine HK, HK$1,110 — the HK listing is the 2023 vintage; no 2024 listing found in Hong Kong (checked 2026-10-28)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-14.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["iodine","sea salt","citrus","wet stone","saline"],"keywords_src":"Beyond Wine tasting note; Decanter review data","description":"A single-vineyard Grillo from old vines inside the Stagnone lagoon reserve — the maritime side of Marsala, saline and iodine-tinged rather than fortified.","background":"\"Officina del Vento\" — workshop of the wind — is the project of Italy's first trio of Masters of Wine, Gabriele Gorelli, Andrea Lonardi and Pietro Russo, who bought a hectare of abandoned 30-to-50-year-old Grillo in the Stagnone di Marsala nature reserve in 2022 and farm it as an argument against land abandonment. The name is the wind that sweeps the lagoon and once turned the salt-pan windmills.\n\nThe debut 2023 was released in March 2025 as 4,176 bottles, fermented 75% in steel and 25% in French oak, ten months on the lees and nine in bottle. This 2024 is the second release from the same vineyard — dry, oaked, about 13%.","sources":"Beyond Wine HK (tasting note, price) · Decanter (100% Grillo, oaked, 13.1%) · producer background (three MWs, Stagnone, 2022 purchase)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-14","photo_src":"img_22f55f2de83d.jpg","no":20,"date_disp":"28 Oct 2026*"},{"name":"Casa Dragones Blanco","name_en":"Casa Dragones Blanco — 100% blue Weber agave tequila, 40%, Jalisco","lang":"es","producer":"Tequila Casa Dragones","vintage":null,"type":"spirit","country":"Mexico","region":"Jalisco · Valle de Tequila","appellation":"Tequila DO","grapes":[],"base":"100% blue Weber agave, hand-harvested at about seven years","abv":40,"price":null,"currency":"HKD","price_src":"No Hong Kong retail listing found at check 2026-10-28 (Liquidz, The Bottle Shop, HK Liquor Store, Watson's Wine, HKTVmall, Vines & Terroirs, Wine Not, Hi-Spirits: none stock it). US reference US$69.99 / 750 ml","venue":"","occasion":"","photo":"images/tastings/2026-10-28-15.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["grapefruit","green apple","black pepper","clove","almond"],"keywords_src":"Casa Dragones official tasting notes","description":"A small-batch silver tequila made by diffuser rather than by roasting whole piñas — so the agave reads raw, green and peppery instead of caramelised.","background":"Casa Dragones does not cook agave in stone or brick ovens. Shredded raw agave goes into a diffuser where hot water and acid carry out acid-thermal hydrolysis, extracting sugar without the roast notes of an oven; fermentation is in stainless steel without fibres, distillation twice in a column still, cut with deep-aquifer spring water from the Volcán de Tequila. The blanco is never rested in oak.\n\nFounded in 2009 by Bertha González Nieves — the first woman certified as Maestra Tequilera — with US media executive Robert Pittman; the blanco itself arrived in 2014. It is a modern, resource-light counterpoint to traditional production, and it is not certified additive-free.","sources":"casadragones.com (tasting notes, spring water, process) · Agave Matchmaker (NOM 1489, acid-thermal hydrolysis, diffuser, 2x column, 40%, unaged) · VinePair (2009 founding, blanco 2014, not additive-free)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-15","photo_src":"img_da398f191e1f.jpg","no":21,"date_disp":"28 Oct 2026*"},{"name":"Don Julio 1942","name_en":"Don Julio 1942 Añejo — 24+ months in ex-bourbon American oak, 40%, Jalisco","lang":"es","producer":"Tequila Don Julio (Diageo)","vintage":null,"type":"spirit","country":"Mexico","region":"Jalisco · Los Altos de Jalisco","appellation":"Tequila DO","grapes":[],"base":"100% blue Weber agave","abv":40,"price":1480,"currency":"HKD","price_src":"Liquidz HK, HK$1,480 (750 ml gift box), checked 2026-10-28 — Beverage d 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-17.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["candied orange peel","agave syrup","almond","clove","roasted coffee"],"keywords_src":"Clase Azul brand copy as published by retailers","description":"The 2021 opening release of Clase Azul's five-part Nuestros Recuerdos series: single-estate añejo in a one-litre matte-black decanter painted with a calavera and Catrina scene.","background":"This is not one of the cream-and-blue 'Edición Indígena' bottles — that nickname belongs to the standard Clase Azul Añejo. The matte-black decanter with gold calavera, Catrinas and a skeleton playing a stringed instrument is the 2021 Día de Muertos edition 'Sabores', the first of five (Sabores 2021, Colores 2022, Aromas 2023, Música 2024, Recuerdos 2025) built around the elements of the Day of the Dead altar.\n\nThe agave comes from a single mountain estate, El Cerro del Viboreo, in Los Altos de Jalisco; the liquid blends añejo aged over 14 months in ex-American whiskey casks with tequilas rested in first-use American oak, light and medium char. 5,000 numbered decanters, one litre, 40%. All the ceramics are thrown and painted by Mazahua artisans at the house's own workshop — which is how the wrong 'Edición Indígena' label gets attached to bottles like this.","sources":"Observer / Forbes México / Quién (series, single estate, 5,000 pieces) · Libation Hub (blend, 1 L) · iCollectEverything (numbering) · Vines & Terroirs HK (sister-edition prices)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-17","photo_src":"img_82ac8875dce2.jpg","no":23,"date_disp":"28 Oct 2026*"},{"name":"贵州茅台酒（赤龙焕彩）","name_en":"Kweichow Moutai 'Chilong Huancai' red dragon, bone china, 500 ml, 53%","lang":"zh","producer":"贵州茅台酒股份有限公司","vintage":null,"type":"baijiu","country":"China","region":"Guizhou · Renhuai, Maotai town","appellation":"贵州茅台酒 GI","grapes":[],"base":"红缨子糯高粱 (red sorghum), wheat qu, water","abv":53,"price":6200,"currency":"HKD","price_src":"茅台專賣店 / Rare Wine, North Point HK — 500 ml 2020 赤龙焕彩红色 53度, HK$6,200, checked 2026-10-28 (same shop: 彩釉珍品 HK$5,800; 精品茅台 2021 HK$7,000)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-18.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["soy sauce","dried plum","honey","mushroom umami","anise"],"keywords_src":"Standard 53% jiangxiang Moutai tasting vocabulary (soy sauce, plum, pear, honey; mushroom and nut on the palate; anise finish)","description":"A decorative 500 ml Moutai in red bone china shaped as a meiping vase and painted underglaze with a golden dragon — the liquid is standard 53% sauce-aroma, the value is the bottle.","background":"The red bottle is the 赤龙焕彩 (Red Dragon) member of Moutai's four-colour 炫彩中国 set — red, yellow, white and blue, each 500 ml at 53%, originally a CITIC Jinling custom commemorative under the 飞天牌 trademark, in bone china with a hand-painted underglaze dragon and the meiping shape.\n\nInside is the ordinary spirit: local red sorghum and wheat qu, stone-pit fermentation through the year, small-batch distillation, years in clay jars before blending. Treat the numbers carefully — several dragon-decorated Moutai editions exist, date codes on the custom runs vary by batch, and red-and-gold dragon Moutai is among the most counterfeited formats; the box, 防伪 label and bottle date code decide the value.","sources":"Beijing Poly 茅台会 lot 7013 (炫彩中国 four-bottle set, CITIC Jinling, bone china, underglaze dragon) · Meijiu (specs) · moutaionly.com HK (HK$6,200) · Sotheby's HK (紫砂金龍 alternative edition)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-18","photo_src":"img_64afe74da546.jpg","no":24,"date_disp":"28 Oct 2026*"},{"name":"Collezione Fabrizio Bianchi Chardonnay","name_en":"Castello di Monsanto 'Collezione' Chardonnay 2024, Toscana IGT","lang":"it","producer":"Castello di Monsanto","vintage":2024,"type":"white","country":"Italy","region":"Toscana · Chianti Classico hills, San Donato in Poggio","appellation":"Toscana IGT","grapes":["Chardonnay"],"abv":13.5,"price":320,"currency":"HKD","price_src":"Casa Certa HK, HK$320 per 750 ml (2024 vintage in stock; 2020 at HK$299), checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-19.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["chamomile","mimosa","yellow peach","sage","buttery"],"keywords_src":"vino.com technical sheet and Casa Certa tasting note","description":"A Burgundy-leaning Tuscan Chardonnay from 1970s vines, two-thirds steel and one-third French oak, aged a year — stone fruit and chamomile over a subtly oaky, saline finish.","background":"Castello di Monsanto sits at San Donato in Poggio in the Chianti Classico hills. Aldo Bianchi bought the castle and farm in 1961; his son Fabrizio vinified the Il Poggio vineyard separately in 1962 — widely described as the first Chianti Classico cru — and the estate is now run by Fabrizio's daughter Laura.\n\nThe Chardonnay came from a mid-1970s decision to plant vines on land outside the Chianti Classico boundary, so it can only be Toscana IGT; first vintage 1990. Fermentation was all in wood at the start, but since 2000 the oak share has fallen to about a third. 'Collezione' is the banner under which this IGT white is sold, named for Bianchi himself.","sources":"castellodimonsanto.it (2024 tech sheet, estate history) · vino.com (aromas) · Casa Certa HK (HK$320)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-19","photo_src":"img_6f3be1223322.jpg","no":25,"date_disp":"28 Oct 2026*"},{"name":"Pian delle Vigne Brunello di Montalcino","name_en":"Antinori Pian delle Vigne Brunello di Montalcino DOCG 2012","lang":"it","producer":"Marchesi Antinori — Tenuta Pian delle Vigne","vintage":2012,"type":"red","country":"Italy","region":"Toscana · Montalcino","appellation":"Brunello di Montalcino DOCG","grapes":["Sangiovese"],"abv":14.0,"price":null,"currency":"HKD","price_src":"No HK listing for the 2012 found (WineWorld, Millesima HK, Buonissimo, HK Online Wine Shop, Casa Certa all carry 2016–2021 only). Closest same-wine HK listing: WineWorld 2016 at HK$520 — checked 2026-10-28","venue":"","occasion":"","photo":"images/tastings/2026-10-28-20.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["red cherry","violet","sweet spice","balsamic","silky tannins"],"keywords_src":"Antinori technical sheet for Pian delle Vigne 2012","description":"Antinori's Montalcino estate: 100% Sangiovese, two years in large oak, bottled April 2015 — the 2012 is mid-weight and perfumed rather than powerful.","background":"Pian delle Vigne is Antinori's Montalcino property, 6 km south-west of the town and named after the 19th-century railway station that still stands by the vines. The family bought the 184-hectare estate, 65 ha under vine, in 1995 and made its first Brunello the same year, farming it deliberately traditionally: long macerations, large oak casks rather than small barrels.\n\n2012 was hot and very dry — no rain from July to mid-September — yet drew the Consorzio's five stars while dividing critics: cool sites made balanced wines, hot slopes gave tough, alcoholic ones. Antinori picked late September to early October, macerated about three weeks at 28 °C, aged two years in cask and bottled in April 2015.","sources":"antinori.it technical sheets (2012) · Kerin O'Keefe / Decanter (2012 vintage) · WineWorld HK (2016 price reference)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-20","photo_src":"img_1bbf9bdf53cd.jpg","no":26,"date_disp":"28 Oct 2026*"},{"name":"Pian delle Vigne Vignaferrovia Brunello Riserva","name_en":"Antinori 'Vignaferrovia' Brunello di Montalcino DOCG Riserva 2012","lang":"it","producer":"Marchesi Antinori — Tenuta Pian delle Vigne","vintage":2012,"type":"red","country":"Italy","region":"Toscana · Montalcino","appellation":"Brunello di Montalcino DOCG Riserva","grapes":["Sangiovese"],"abv":14.5,"price":null,"currency":"HKD","price_src":"No HK listing found at check 2026-10-28. Closest verifiable listing with the vintage: SAQ Quebec, CA$159 per 750 ml (listed, not available online)","venue":"","occasion":"","photo":"images/tastings/2026-10-28-21.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["wild cherry","red currant","balsamic","sweet spice","cocoa"],"keywords_src":"Antinori technical sheet for Vignaferrovia 2012","description":"A single-parcel Riserva from the four-hectare Vignaferrovia plot beside the old station, made only in the best years — denser than the normale but still fresh.","background":"Vignaferrovia is a place, not a brand: roughly four hectares of calcareous clay rich in small stones next to the 19th-century station that gives the estate its name, south-west facing so sea breezes temper the summer. It is bottled only in the finest vintages — first in 2004, skipped in 2005, 2008, 2011, 2014 and 2017.\n\nThe Riserva differs in law and in handling: Brunello needs four years before release, two in oak and four months in bottle; a Riserva needs five, with six months in bottle. In 2012 the grapes macerated about 24 days, then 500-litre barrels followed by 3,000-litre casks for two and a half years, bottled May 2016 — later than the normale's April 2015.","sources":"antinori.it estate and 2012 tech sheets (Vignaferrovia, 24 days, 2.5 years, May 2016) · Italian Wine Central (DOCG ageing) · SAQ (price reference)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-21","photo_src":"img_ef13175135a2.jpg","no":27,"date_disp":"28 Oct 2026*"},{"name":"Beluga Noble Vodka","name_en":"Beluga Noble — Siberian grain vodka, 3-litre export bottle, 40%","lang":"en","producer":"Beluga / Mariinsk distillery (Noblewood Group)","vintage":null,"type":"vodka","country":"Russia","region":"Siberia · Mariinsk, Kemerovo","appellation":"","grapes":[],"base":"Siberian winter wheat and grain spirit, Siberian spring water","abv":40,"price":null,"currency":"HKD","price_src":"No Hong Kong listing for the 3-litre found (checked 2026-10-28). EU reference: Hansa (Malta) €180 for the 3 L, €48 for 70 cl; UAE AED 725–1,048 for 3 L","venue":"","occasion":"","photo":"images/tastings/2026-10-28-22.jpg","sat":{},"score":null,"note":"","note_src":"","keywords":["clean","vanilla","oatmeal","grain sweetness","creamy finish"],"keywords_src":"Trade tasting notes for Beluga Noble (clean nose, vanilla and oatmeal, soft creamy texture)","description":"A Siberian grain vodka, triple distilled, rested a month and filtered through quartz sand, silver and birch charcoal — the 3-litre export bottle you meet in duty free.","background":"Beluga is made at the Mariinsk distillery in the Kemerovo region of Siberia, from winter wheat and other grain spirit cut with Siberian spring water; liquor.com lists it as a column-still vodka first released in 2002. The house process is triple distillation, a 30-day rest so the components settle, then filtration through quartz sand, a silver filter and a bed of birch charcoal.\n\nThe brand is owned by Noblewood Group, a Montenegro-based company — which is what the 「NOBLEWOOD ADRIATIC · EXPORT」 line on this label refers to, not a different liquid. Three litres at 40% is the travel-retail format, the same spirit as the 70 cl bottle.","sources":"vodka-beluga.com · liquor.com (Mariinsk, column still, released 2002, winter wheat) · Blackwell's / Caskers (30-day rest, multi-stage filtration, quartz sand, birch charcoal) · Forbes (owned by Noblewood Group, Montenegro) · Hansa / UAE shops (prices)","date":"2026-10-28","date_guess":true,"added":"2026-10-28","id":"2026-10-28-22","no":28,"date_disp":"28 Oct 2026*"}];

const T = {
  zh:{covk:'WSET L2 品種', sec:'酒藏', journal:'日誌', sort:'最新優先', sortScore:'按分數',
      all:'全部', empty:'還沒有記錄。下一支酒，就是第一格。',
      count:(n)=>`${n} 支`, tasted:'已嚐', of:'/', jblankdate:'未有日期——你講低幾時飲，就會排到這裡。',
      k_bottles:'支', k_grapes:'品種', k_countries:'國家', k_avg:'平均分'},
  en:{covk:'WSET L2 VARIETIES', sec:'CELLAR', journal:'JOURNAL', sort:'Newest first', sortScore:'By score',
      all:'All', empty:'No records yet. The next bottle is the first card.',
      count:(n)=>`${n} ${n===1?'bottle':'bottles'}`, tasted:'tasted', of:'/', jblankdate:'No dates yet — tell me when you drank it and it lands here.',
      k_bottles:'Bottles', k_grapes:'Varieties', k_countries:'Countries', k_avg:'Avg score'}
};
const TYPE = {
  red:['紅酒','Red'], white:['白酒','White'], rose:['粉紅','Rosé'], sparkling:['氣泡','Sparkling'],
  baijiu:['中國白酒','Baijiu'], vodka:['伏特加','Vodka'],
  fortified:['加烈','Fortified'], spirit:['烈酒','Spirit'], sake:['清酒','Sake'], beer:['啤酒','Beer']
};
let LANG='en', TYPE_FILTER='all', COUNTRY_FILTER='all', GRAPE_FILTER='', QUERY='', BY_SCORE=false;

const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(k)=>T[LANG][k];
const nameOf=(g)=>{const c=CATALOG.find(x=>x.key===g||x.en===g||x.cn===g);return c?(LANG==='zh'?c.cn:c.en):g;};
const typeOf=(ty)=>TYPE[ty]?TYPE[ty][LANG==='zh'?0:1]:ty;

function realTastings(){return TASTINGS.filter(x=>x.date||x.producer||x.name);}

function renderStats(){
  const list=realTastings();
  const grapes=new Set(); const countries=new Set(); const scores=[];
  list.forEach(x=>{ (x.grapes||[]).forEach(g=>grapes.add(g)); if(x.country)countries.add(x.country); if(x.score)scores.push(x.score); });
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):'—';
  const cells=[[list.length,t('k_bottles')],[grapes.size,t('k_grapes')],[countries.size,t('k_countries')],[avg,t('k_avg')]];
  $('#stats').innerHTML=cells.map(([v,k])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}

function renderCoverage(){
  const list=realTastings();
  const have=new Set();
  list.forEach(x=>(x.grapes||[]).forEach(g=>have.add(g)));
  const isHave=(c)=>have.has(c.key)||have.has(c.en)||have.has(c.cn)||
      (c.key==='semillon'&&have.has('Sémillon'))||(c.key==='albarino'&&have.has('Albariño'));
  const n=CATALOG.filter(isHave).length;
  $('#covk').textContent=t('covk');
  $('#covn').innerHTML=`${t('tasted')} <b>${n}</b> / ${CATALOG.length}`;
  const bar=document.querySelector('.cov .h .bar i');
  if(bar) bar.style.width=(100*n/CATALOG.length).toFixed(1)+'%';
  const chip=(c)=>{const hv=isHave(c); const label=LANG==='zh'?c.cn:c.en;
    return `<span class="chip${hv?' have':''}${c.principal?' p':''}" data-g="${esc(c.en)}" title="${esc(c.en)}">${esc(label)}</span>`;};
  const P=CATALOG.filter(c=>c.principal), R=CATALOG.filter(c=>!c.principal);
  $('#chips').innerHTML =
    `<div class="covgroup"><div class="gl">${LANG==='zh'?'核心品種 · 8':'PRINCIPAL · 8'}</div><div class="chips" style="margin-top:0">${P.map(chip).join('')}</div></div>`+
    `<div class="covgroup"><div class="gl">${LANG==='zh'?'地區品種 · 22':'REGIONAL · 22'}</div><div class="chips" style="margin-top:0">${R.map(chip).join('')}</div></div>`;
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    const g=el.dataset.g; GRAPE_FILTER = (GRAPE_FILTER===g)?'':g; renderFilters(); renderGrid();
  });
}

function renderFilters(){
  const list=realTastings();
  const ORDER=['red','white','rose','sparkling','fortified','baijiu','vodka','spirit','sake','beer'];
  const types=[...new Set(list.map(x=>x.type).filter(Boolean))].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const countries=[...new Set(list.map(x=>x.country).filter(Boolean))];
  $('#tyfilters').innerHTML=`<button class="pill${TYPE_FILTER==='all'?' active':''}" data-ty="all">${t('all')}</button>`+
    types.map(ty=>`<button class="pill${TYPE_FILTER===ty?' active':''}" data-ty="${esc(ty)}">${esc(typeOf(ty))}</button>`).join('');
  document.querySelectorAll('#tyfilters .pill').forEach(b=>b.onclick=()=>{TYPE_FILTER=b.dataset.ty;renderFilters();renderGrid();});
  $('#cfilters').innerHTML=`<span class="lab">${LANG==='zh'?'產地':'ORIGIN'}</span>`+
    [`<button class="pill${COUNTRY_FILTER==='all'?' active':''}" data-c="all">${t('all')}</button>`]
      .concat(countries.map(c=>`<button class="pill${COUNTRY_FILTER===c?' active':''}" data-c="${esc(c)}">${esc(c)}</button>`)).join('');
  document.querySelectorAll('#cfilters .pill').forEach(b=>b.onclick=()=>{COUNTRY_FILTER=b.dataset.c;renderFilters();renderGrid();});
  $('#sortbtn').textContent=BY_SCORE?t('sortScore'):t('sort');
}

function matches(x){
  if(TYPE_FILTER!=='all'&&x.type!==TYPE_FILTER)return false;
  if(COUNTRY_FILTER!=='all'&&x.country!==COUNTRY_FILTER)return false;
  if(GRAPE_FILTER){const gs=(x.grapes||[]).map(g=>nameOf(g));if(!gs.includes(nameOf(GRAPE_FILTER)))return false;}
  if(QUERY){const hay=[x.name,x.producer,x.region,x.appellation,x.note].concat(x.grapes||[]).join(' ').toLowerCase();
    if(!hay.includes(QUERY.toLowerCase()))return false;}
  return true;
}

function card(x){
  const gs=(x.grapes||[]).map(g=>`<span>${esc(nameOf(g))}</span>`).join('');
  const img=x.photo?`<img class="shot" src="${esc(x.photo)}" alt="${esc(x.name)}" loading="lazy">`
    :`<div class="noimg">
        <svg class="enso" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M50 10a40 40 0 1 1-12 78" stroke-linecap="round"/></svg>
        <svg class="btl" viewBox="0 0 40 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M16 8h8v26c0 5 9 9 9 17v55a6 6 0 0 1-6 6H13a6 6 0 0 1-6-6V51c0-8 9-12 9-17V8z"/>
          <path d="M7 62h26" stroke-width="1"/>
          <path d="M7 74h26" stroke-width=".8" opacity=".55"/>
        </svg>
      </div>`;
  const no=String(x.no||0).padStart(3,"0");
  return `<a class="card" href="bottle-${no}/">
    ${x.sample?`<span class="tag">${LANG==='zh'?'樣本':'SAMPLE'}</span>`:''}
    ${x.score?`<span class="seal">${x.score}</span>`:''}
    ${img}
    <div class="body">
      <div class="nm">${esc(x.name)}</div>
      ${x.name_en?`<div class="nmen">${esc(x.name_en)}</div>`:''}
      ${(x.producer||x.vintage)?`<div class="pr">${esc([x.producer,x.vintage].filter(Boolean).join(' · '))}</div>`:''}
      <div class="rg">${esc([x.country,x.region].filter(Boolean).join(' · '))}</div>
      <div class="gr">${gs}</div>
      <span class="go">view →</span>
    </div>
  </a>`;
}

function renderGrid(){
  const list=realTastings().filter(matches);
  const sorted=list.slice().sort((a,b)=>{
    if(BY_SCORE)return (b.score||0)-(a.score||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  $('#seck').textContent=t('sec');
  $('#secn').textContent=t('count')(sorted.length);
  if(!sorted.length){
    $('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1">${t('empty')}</div>`;
    renderJournal();
    return;
  }
  const ORDER=['sparkling','white','red','rose','fortified','sake','baijiu','vodka','spirit','beer'];
  const groups={};
  sorted.forEach(x=>{ const k=x.type||'other'; (groups[k]=groups[k]||[]).push(x); });
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  $('#grid').innerHTML = keys.map(k=>{
    const rows=groups[k];
    return `<div class="typeblock">
      <div class="typehead"><span class="tk">${esc(typeOf(k))}</span><span class="tn">${rows.length}</span></div>
      <div class="grid">${rows.map(card).join('')}</div></div>`;
  }).join('');
  renderJournal();
}

function renderJournal(){
  const list=realTastings().filter(x=>x.date).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('#jk').textContent=t('journal');
  $('#jn').textContent=list.length?`${list.length}`:'';
  $("#jlist").innerHTML = list.length? list.map(x=>`<a class="jrow" href="bottle-${String(x.no||0).padStart(3,"0")}/">
      <span class="jd">${esc(x.date_disp||x.date)}</span>
      <span class="jn">${esc(x.name)}</span>
      <span class="jv">${esc(x.venue||'—')}</span>
      <span class="js">${x.score||'—'}</span></a>`).join('')
      + `<div class="jn te" style="border:0;padding-top:8px;color:var(--muted);font-size:.64rem;letter-spacing:.06em">
           * dated when the bottle was logged; tell me the real day and I will correct it.</div>`
    : `<div class="jempty">${realTastings().length?t('jblankdate'):t('empty')}</div>`;
}

$('#q').oninput=(e)=>{QUERY=e.target.value.trim();renderGrid();};
$('#sortbtn').onclick=()=>{BY_SCORE=!BY_SCORE;renderFilters();renderGrid();};
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l;
  document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));
  $('#ft2').textContent=LANG==='zh'?'飲過的，記下來':'what I drank, written down';
  $('#q').placeholder=LANG==='zh'?'搜尋酒名、產區、品種…':'search wine, region, grape…';
  renderStats();renderCoverage();renderFilters();renderGrid();
});

renderStats();renderCoverage();renderFilters();renderGrid();

/* site visit counter — external service; renders nothing if it fails */
fetch('https://abacus.jasoncameron.dev/hit/'+"just-drink"+'/site')
  .then(r=>r.json())
  .then(d=>{ if(d && typeof d.value==='number'){ const el=$('#siteviews');
      el.textContent=d.value+(d.value===1?' visit':' visits'); el.hidden=false; } })
  .catch(()=>{});
</script>
</body>
</html>
